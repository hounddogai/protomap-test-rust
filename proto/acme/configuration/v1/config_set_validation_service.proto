syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetValidationServiceProto";
option java_package = "com.acme.configuration.v1";

// Checks config sets against the rules before anything acts on them.
service ConfigSetValidationService {
  // Validates a config set.
  rpc ValidateConfigSet(ValidateConfigSetRequest) returns (ValidateConfigSetResponse);

  // Previews a config set.
  rpc PreviewConfigSet(PreviewConfigSetRequest) returns (PreviewConfigSetResponse);

  // Checks a config set.
  rpc CheckConfigSetEligibility(CheckConfigSetEligibilityRequest) returns (CheckConfigSetEligibilityResponse);

  // Normalizes a config set.
  rpc NormalizeConfigSet(NormalizeConfigSetRequest) returns (NormalizeConfigSetResponse);

  // Explains a config set.
  rpc ExplainConfigSetDecision(ExplainConfigSetDecisionRequest) returns (ExplainConfigSetDecisionResponse);

  // Scores a config set.
  rpc ScoreConfigSet(ScoreConfigSetRequest) returns (ScoreConfigSetResponse);

  // Lints a config set.
  rpc LintConfigSets(LintConfigSetsRequest) returns (LintConfigSetsResponse);

  // Returns a config set.
  rpc GetConfigSetRules(GetConfigSetRulesRequest) returns (GetConfigSetRulesResponse);
}

// The request of `ValidateConfigSet`.
message ValidateConfigSetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  ConfigSet config_set = 3;
  ValidateConfigSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateConfigSet`.
message ValidateConfigSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigSet config_set = 1;
  ValidateConfigSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

