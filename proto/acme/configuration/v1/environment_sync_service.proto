syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentSyncServiceProto";
option java_package = "com.acme.configuration.v1";

// Keeps environments in step with the systems of record in other regions.
service EnvironmentSyncService {
  // Syncs an environment.
  rpc SyncEnvironments(SyncEnvironmentsRequest) returns (SyncEnvironmentsResponse);

  // Pushs an environment.
  rpc PushEnvironment(PushEnvironmentRequest) returns (PushEnvironmentResponse);

  // Pulls an environment.
  rpc PullEnvironments(PullEnvironmentsRequest) returns (PullEnvironmentsResponse);

  // Reconciles an environment.
  rpc ReconcileEnvironments(ReconcileEnvironmentsRequest) returns (ReconcileEnvironmentsResponse);

  // Exchanges changes of environments with a peer.
  rpc StreamEnvironmentChanges(stream StreamEnvironmentChangesRequest) returns (stream StreamEnvironmentChangesResponse);

  // Resolves an environment.
  rpc ResolveEnvironmentConflict(ResolveEnvironmentConflictRequest) returns (ResolveEnvironmentConflictResponse);

  // Returns an environment.
  rpc GetEnvironmentSyncState(GetEnvironmentSyncStateRequest) returns (GetEnvironmentSyncStateResponse);

  // Lists environments a page at a time.
  rpc ListEnvironmentConflicts(ListEnvironmentConflictsRequest) returns (ListEnvironmentConflictsResponse);
}

// The request of `SyncEnvironments`.
message SyncEnvironmentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  SyncEnvironmentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncEnvironments`.
message SyncEnvironmentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Environment environment = 1;
  SyncEnvironmentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushEnvironment`.
message PushEnvironmentRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  PushEnvironmentRequest.Details details = 4;
