    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  ReconcileEnvironmentsRequest.Details details = 4;
  string reason = 5;
