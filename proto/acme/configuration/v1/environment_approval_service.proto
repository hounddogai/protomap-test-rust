syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentApprovalServiceProto";
option java_package = "com.acme.configuration.v1";

// Routes environments through approval, with escalation and delegation.
service EnvironmentApprovalService {
  // Submits an environment.
  rpc SubmitEnvironment(SubmitEnvironmentRequest) returns (SubmitEnvironmentResponse);

  // Approves an environment.
  rpc ApproveEnvironment(ApproveEnvironmentRequest) returns (ApproveEnvironmentResponse);

  // Rejects an environment.
  rpc RejectEnvironment(RejectEnvironmentRequest) returns (RejectEnvironmentResponse);

  // Escalates an environment.
  rpc EscalateEnvironment(EscalateEnvironmentRequest) returns (EscalateEnvironmentResponse);

  // Lists environments a page at a time.
  rpc ListPendingEnvironments(ListPendingEnvironmentsRequest) returns (ListPendingEnvironmentsResponse);

  // Delegates an environment.
  rpc DelegateEnvironmentApproval(DelegateEnvironmentApprovalRequest) returns (DelegateEnvironmentApprovalResponse);

  // Recalls an environment.
  rpc RecallEnvironment(RecallEnvironmentRequest) returns (RecallEnvironmentResponse);

  // Returns an environment.
  rpc GetEnvironmentApprovalStatus(GetEnvironmentApprovalStatusRequest) returns (GetEnvironmentApprovalStatusResponse);

  // Comments an environment.
  rpc CommentEnvironmentApproval(CommentEnvironmentApprovalRequest) returns (CommentEnvironmentApprovalResponse);
}

// The request of `SubmitEnvironment`.
message SubmitEnvironmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  SubmitEnvironmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEnvironment`.
message SubmitEnvironmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Environment environment = 1;
  SubmitEnvironmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

