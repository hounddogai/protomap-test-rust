option java_multiple_files = true;
option java_outer_classname = "ConfigSetWorkflowServiceProto";
option java_package = "com.acme.configuration.v1";

// Runs the long-lived workflow that takes a config set from start to finish.
service ConfigSetWorkflowService {
  // Starts a config set.
  rpc StartConfigSetWorkflow(StartConfigSetWorkflowRequest) returns (StartConfigSetWorkflowResponse);

  // Advances a config set.
  rpc AdvanceConfigSetWorkflow(AdvanceConfigSetWorkflowRequest) returns (AdvanceConfigSetWorkflowResponse);

  // Cancels a config set.
  rpc CancelConfigSetWorkflow(CancelConfigSetWorkflowRequest) returns (CancelConfigSetWorkflowResponse);

  // Pauses a config set.
  rpc PauseConfigSetWorkflow(PauseConfigSetWorkflowRequest) returns (PauseConfigSetWorkflowResponse);

  // Resumes a config set.
  rpc ResumeConfigSetWorkflow(ResumeConfigSetWorkflowRequest) returns (ResumeConfigSetWorkflowResponse);

  // Returns a config set.
  rpc InspectConfigSetWorkflow(InspectConfigSetWorkflowRequest) returns (InspectConfigSetWorkflowResponse);

  // Signals a config set.
  rpc SignalConfigSetWorkflow(SignalConfigSetWorkflowRequest) returns (SignalConfigSetWorkflowResponse);
}

// The request of `StartConfigSetWorkflow`.
message StartConfigSetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  ConfigSet config_set = 3;
  StartConfigSetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConfigSetWorkflow`.
message StartConfigSetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigSet config_set = 1;
  StartConfigSetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

