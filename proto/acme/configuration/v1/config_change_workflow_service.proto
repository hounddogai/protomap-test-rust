syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigChangeWorkflowServiceProto";
option java_package = "com.acme.configuration.v1";

// Runs the long-lived workflow that takes a config change from start to finish.
service ConfigChangeWorkflowService {
  // Starts a config change.
  rpc StartConfigChangeWorkflow(StartConfigChangeWorkflowRequest) returns (StartConfigChangeWorkflowResponse);

  // Advances a config change.
  rpc AdvanceConfigChangeWorkflow(AdvanceConfigChangeWorkflowRequest) returns (AdvanceConfigChangeWorkflowResponse);

  // Cancels a config change.
  rpc CancelConfigChangeWorkflow(CancelConfigChangeWorkflowRequest) returns (CancelConfigChangeWorkflowResponse);

  // Retrys a config change.
  rpc RetryConfigChangeWorkflow(RetryConfigChangeWorkflowRequest) returns (RetryConfigChangeWorkflowResponse);

  // Resumes a config change.
  rpc ResumeConfigChangeWorkflow(ResumeConfigChangeWorkflowRequest) returns (ResumeConfigChangeWorkflowResponse);

  // Returns a config change.
  rpc InspectConfigChangeWorkflow(InspectConfigChangeWorkflowRequest) returns (InspectConfigChangeWorkflowResponse);

  // Signals a config change.
  rpc SignalConfigChangeWorkflow(SignalConfigChangeWorkflowRequest) returns (SignalConfigChangeWorkflowResponse);
}

// The request of `StartConfigChangeWorkflow`.
message StartConfigChangeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_change_id = 2;
  ConfigChange config_change = 3;
  StartConfigChangeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConfigChangeWorkflow`.
message StartConfigChangeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigChange config_change = 1;
  StartConfigChangeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

