syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigChangeLifecycleServiceProto";
option java_package = "com.acme.configuration.v1";

// Moves a config change between the states of its lifecycle.
service ConfigChangeLifecycleService {
  // Activates a config change.
  rpc ActivateConfigChange(ActivateConfigChangeRequest) returns (ActivateConfigChangeResponse);

  // Suspends a config change.
  rpc SuspendConfigChange(SuspendConfigChangeRequest) returns (SuspendConfigChangeResponse);

  // Reinstates a config change.
  rpc ReinstateConfigChange(ReinstateConfigChangeRequest) returns (ReinstateConfigChangeResponse);

  // Terminates a config change.
  rpc TerminateConfigChange(TerminateConfigChangeRequest) returns (TerminateConfigChangeResponse);

  // Renews a config change.
  rpc RenewConfigChange(RenewConfigChangeRequest) returns (RenewConfigChangeResponse);

  // Expires a config change.
  rpc ExpireConfigChange(ExpireConfigChangeRequest) returns (ExpireConfigChangeResponse);

  // Returns a config change.
  rpc GetConfigChangeLifecycle(GetConfigChangeLifecycleRequest) returns (GetConfigChangeLifecycleResponse);

  // Schedules a config change.
  rpc ScheduleConfigChangeExpiry(ScheduleConfigChangeExpiryRequest) returns (ScheduleConfigChangeExpiryResponse);
}

// The request of `ActivateConfigChange`.
message ActivateConfigChangeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string config_change_id = 2;
  ActivateConfigChangeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateConfigChange`.
message ActivateConfigChangeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigChange config_change = 1;
  ActivateConfigChangeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

