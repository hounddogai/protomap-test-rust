syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetReportingServiceProto";
option java_package = "com.acme.configuration.v1";

// Builds and schedules reports about config sets.
service ConfigSetReportingService {
  // Generates a config set.
  rpc GenerateConfigSetReport(GenerateConfigSetReportRequest) returns (GenerateConfigSetReportResponse);

  // Returns a config set.
  rpc FetchConfigSetReport(FetchConfigSetReportRequest) returns (FetchConfigSetReportResponse);

  // Streams the changes of config sets as they happen.
  rpc StreamConfigSetMetrics(StreamConfigSetMetricsRequest) returns (stream StreamConfigSetMetricsResponse);

  // Lists config sets a page at a time.
  rpc ListConfigSetReports(ListConfigSetReportsRequest) returns (ListConfigSetReportsResponse);

  // Shares a config set.
  rpc ShareConfigSetReport(ShareConfigSetReportRequest) returns (ShareConfigSetReportResponse);

  // Counts config sets by status.
  rpc CountConfigSetTotals(CountConfigSetTotalsRequest) returns (CountConfigSetTotalsResponse);

  // Deletes a config set.
  rpc DeleteConfigSetReport(DeleteConfigSetReportRequest) returns (DeleteConfigSetReportResponse);
}

// The request of `GenerateConfigSetReport`.
message GenerateConfigSetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  GenerateConfigSetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateConfigSetReport`.
message GenerateConfigSetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchConfigSetReport`.
message FetchConfigSetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchConfigSetReport`.
message FetchConfigSetReportResponse {
  ConfigSet config_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamConfigSetMetrics`.
message StreamConfigSetMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamConfigSetMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamConfigSetMetrics`.
message StreamConfigSetMetricsResponse {
  ConfigSet config_set = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListConfigSetReports`.
message ListConfigSetReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListConfigSetReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListConfigSetReports`.
message ListConfigSetReportsResponse {
  repeated ConfigSet config_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareConfigSetReport`.
message ShareConfigSetReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  ShareConfigSetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareConfigSetReport`.
message ShareConfigSetReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigSet config_set = 1;
  ShareConfigSetReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConfigSetTotals`.
message CountConfigSetTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConfigSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConfigSetTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConfigSetTotals`.
message CountConfigSetTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteConfigSetReport`.
message DeleteConfigSetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteConfigSetReport`.
message DeleteConfigSetReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
