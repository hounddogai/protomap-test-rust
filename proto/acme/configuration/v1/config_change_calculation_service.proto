  }

  ConfigChange config_change = 1;
  ExplainConfigChangeCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetConfigChangeRates`.
message GetConfigChangeRatesRequest {
