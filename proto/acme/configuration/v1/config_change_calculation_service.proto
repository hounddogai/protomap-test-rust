syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigChangeCalculationServiceProto";
option java_package = "com.acme.configuration.v1";

// Computes the figures of a config change, such as totals, taxes, and estimates.
service ConfigChangeCalculationService {
  // Calculates a config change.
  rpc CalculateConfigChange(CalculateConfigChangeRequest) returns (CalculateConfigChangeResponse);

  // Estimates a config change.
  rpc EstimateConfigChange(EstimateConfigChangeRequest) returns (EstimateConfigChangeResponse);

  // Quotes a config change.
  rpc QuoteConfigChange(QuoteConfigChangeRequest) returns (QuoteConfigChangeResponse);

  // Compares a config change.
  rpc CompareConfigChangeOptions(CompareConfigChangeOptionsRequest) returns (CompareConfigChangeOptionsResponse);

  // Recalculates a config change.
  rpc RecalculateConfigChanges(RecalculateConfigChangesRequest) returns (RecalculateConfigChangesResponse);

  // Simulates a config change.
  rpc SimulateConfigChange(SimulateConfigChangeRequest) returns (SimulateConfigChangeResponse);

  // Explains a config change.
  rpc ExplainConfigChangeCalculation(ExplainConfigChangeCalculationRequest) returns (ExplainConfigChangeCalculationResponse);

  // Returns a config change.
  rpc GetConfigChangeRates(GetConfigChangeRatesRequest) returns (GetConfigChangeRatesResponse);
}

// The request of `CalculateConfigChange`.
message CalculateConfigChangeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_change_id = 2;
  ConfigChange config_change = 3;
  CalculateConfigChangeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateConfigChange`.
message CalculateConfigChangeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateConfigChangeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ConfigChange config_change = 1;
  CalculateConfigChangeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

