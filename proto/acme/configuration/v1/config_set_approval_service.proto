syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetApprovalServiceProto";
option java_package = "com.acme.configuration.v1";

// Routes config sets through approval, with escalation and delegation.
service ConfigSetApprovalService {
  // Submits a config set.
  rpc SubmitConfigSet(SubmitConfigSetRequest) returns (SubmitConfigSetResponse);

  // Approves a config set.
  rpc ApproveConfigSet(ApproveConfigSetRequest) returns (ApproveConfigSetResponse);

  // Rejects a config set.
  rpc RejectConfigSet(RejectConfigSetRequest) returns (RejectConfigSetResponse);

  // Escalates a config set.
  rpc EscalateConfigSet(EscalateConfigSetRequest) returns (EscalateConfigSetResponse);

  // Lists config sets a page at a time.
  rpc ListPendingConfigSets(ListPendingConfigSetsRequest) returns (ListPendingConfigSetsResponse);

  // Delegates a config set.
  rpc DelegateConfigSetApproval(DelegateConfigSetApprovalRequest) returns (DelegateConfigSetApprovalResponse);

  // Recalls a config set.
  rpc RecallConfigSet(RecallConfigSetRequest) returns (RecallConfigSetResponse);

  // Returns a config set.
  rpc GetConfigSetApprovalStatus(GetConfigSetApprovalStatusRequest) returns (GetConfigSetApprovalStatusResponse);

  // Comments a config set.
  rpc CommentConfigSetApproval(CommentConfigSetApprovalRequest) returns (CommentConfigSetApprovalResponse);
}

// The request of `SubmitConfigSet`.
message SubmitConfigSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  ConfigSet config_set = 3;
  SubmitConfigSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitConfigSet`.
message SubmitConfigSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigSet config_set = 1;
  SubmitConfigSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

