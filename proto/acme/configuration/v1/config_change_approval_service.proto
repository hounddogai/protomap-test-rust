syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigChangeApprovalServiceProto";
option java_package = "com.acme.configuration.v1";

// Routes config changes through approval, with escalation and delegation.
service ConfigChangeApprovalService {
  // Submits a config change.
  rpc SubmitConfigChange(SubmitConfigChangeRequest) returns (SubmitConfigChangeResponse);

  // Approves a config change.
  rpc ApproveConfigChange(ApproveConfigChangeRequest) returns (ApproveConfigChangeResponse);

  // Rejects a config change.
  rpc RejectConfigChange(RejectConfigChangeRequest) returns (RejectConfigChangeResponse);

  // Lists config changes a page at a time.
  rpc ListPendingConfigChanges(ListPendingConfigChangesRequest) returns (ListPendingConfigChangesResponse);

  // Delegates a config change.
  rpc DelegateConfigChangeApproval(DelegateConfigChangeApprovalRequest) returns (DelegateConfigChangeApprovalResponse);

  // Recalls a config change.
  rpc RecallConfigChange(RecallConfigChangeRequest) returns (RecallConfigChangeResponse);
}

// The request of `SubmitConfigChange`.
message SubmitConfigChangeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_change_id = 2;
  ConfigChange config_change = 3;
  SubmitConfigChangeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitConfigChange`.
message SubmitConfigChangeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigChange config_change = 1;
  SubmitConfigChangeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

