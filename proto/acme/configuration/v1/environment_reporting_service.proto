syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentReportingServiceProto";
option java_package = "com.acme.configuration.v1";

// Builds and schedules reports about environments.
service EnvironmentReportingService {
  // Generates an environment.
  rpc GenerateEnvironmentReport(GenerateEnvironmentReportRequest) returns (GenerateEnvironmentReportResponse);

  // Returns an environment.
  rpc FetchEnvironmentReport(FetchEnvironmentReportRequest) returns (FetchEnvironmentReportResponse);

  // Schedules an environment.
  rpc ScheduleEnvironmentReport(ScheduleEnvironmentReportRequest) returns (ScheduleEnvironmentReportResponse);

  // Streams the changes of environments as they happen.
  rpc StreamEnvironmentMetrics(StreamEnvironmentMetricsRequest) returns (stream StreamEnvironmentMetricsResponse);

  // Lists environments a page at a time.
  rpc ListEnvironmentReports(ListEnvironmentReportsRequest) returns (ListEnvironmentReportsResponse);

  // Shares an environment.
  rpc ShareEnvironmentReport(ShareEnvironmentReportRequest) returns (ShareEnvironmentReportResponse);

  // Counts environments by status.
  rpc CountEnvironmentTotals(CountEnvironmentTotalsRequest) returns (CountEnvironmentTotalsResponse);

  // Deletes an environment.
  rpc DeleteEnvironmentReport(DeleteEnvironmentReportRequest) returns (DeleteEnvironmentReportResponse);
}

// The request of `GenerateEnvironmentReport`.
message GenerateEnvironmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  GenerateEnvironmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateEnvironmentReport`.
message GenerateEnvironmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchEnvironmentReport`.
message FetchEnvironmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchEnvironmentReport`.
message FetchEnvironmentReportResponse {
  Environment environment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleEnvironmentReport`.
message ScheduleEnvironmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  ScheduleEnvironmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleEnvironmentReport`.
message ScheduleEnvironmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamEnvironmentMetrics`.
message StreamEnvironmentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EnvironmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamEnvironmentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamEnvironmentMetrics`.
message StreamEnvironmentMetricsResponse {
  Environment environment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListEnvironmentReports`.
message ListEnvironmentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EnvironmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEnvironmentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEnvironmentReports`.
message ListEnvironmentReportsResponse {
  repeated Environment environments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareEnvironmentReport`.
message ShareEnvironmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  ShareEnvironmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareEnvironmentReport`.
message ShareEnvironmentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Environment environment = 1;
  ShareEnvironmentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEnvironmentTotals`.
message CountEnvironmentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EnvironmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEnvironmentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEnvironmentTotals`.
message CountEnvironmentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteEnvironmentReport`.
message DeleteEnvironmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteEnvironmentReport`.
message DeleteEnvironmentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
