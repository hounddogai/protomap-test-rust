syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentCalculationServiceProto";
option java_package = "com.acme.configuration.v1";

// Computes the figures of an environment, such as totals, taxes, and estimates.
service EnvironmentCalculationService {
  // Calculates an environment.
  rpc CalculateEnvironment(CalculateEnvironmentRequest) returns (CalculateEnvironmentResponse);

  // Estimates an environment.
  rpc EstimateEnvironment(EstimateEnvironmentRequest) returns (EstimateEnvironmentResponse);

  // Quotes an environment.
  rpc QuoteEnvironment(QuoteEnvironmentRequest) returns (QuoteEnvironmentResponse);

  // Compares an environment.
  rpc CompareEnvironmentOptions(CompareEnvironmentOptionsRequest) returns (CompareEnvironmentOptionsResponse);

  // Recalculates an environment.
  rpc RecalculateEnvironments(RecalculateEnvironmentsRequest) returns (RecalculateEnvironmentsResponse);

  // Simulates an environment.
  rpc SimulateEnvironment(SimulateEnvironmentRequest) returns (SimulateEnvironmentResponse);

  // Returns an environment.
  rpc GetEnvironmentRates(GetEnvironmentRatesRequest) returns (GetEnvironmentRatesResponse);
}

// The request of `CalculateEnvironment`.
message CalculateEnvironmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  CalculateEnvironmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEnvironment`.
message CalculateEnvironmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEnvironmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Environment environment = 1;
  CalculateEnvironmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

