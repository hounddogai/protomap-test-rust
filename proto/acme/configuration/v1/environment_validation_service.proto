syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentValidationServiceProto";
option java_package = "com.acme.configuration.v1";

// Checks environments against the rules before anything acts on them.
service EnvironmentValidationService {
  // Validates an environment.
  rpc ValidateEnvironment(ValidateEnvironmentRequest) returns (ValidateEnvironmentResponse);

  // Previews an environment.
  rpc PreviewEnvironment(PreviewEnvironmentRequest) returns (PreviewEnvironmentResponse);

  // Checks an environment.
  rpc CheckEnvironmentEligibility(CheckEnvironmentEligibilityRequest) returns (CheckEnvironmentEligibilityResponse);

  // Normalizes an environment.
  rpc NormalizeEnvironment(NormalizeEnvironmentRequest) returns (NormalizeEnvironmentResponse);

  // Explains an environment.
  rpc ExplainEnvironmentDecision(ExplainEnvironmentDecisionRequest) returns (ExplainEnvironmentDecisionResponse);

  // Scores an environment.
  rpc ScoreEnvironment(ScoreEnvironmentRequest) returns (ScoreEnvironmentResponse);

  // Lints an environment.
  rpc LintEnvironments(LintEnvironmentsRequest) returns (LintEnvironmentsResponse);

  // Returns an environment.
  rpc GetEnvironmentRules(GetEnvironmentRulesRequest) returns (GetEnvironmentRulesResponse);
}

// The request of `ValidateEnvironment`.
message ValidateEnvironmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  ValidateEnvironmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEnvironment`.
message ValidateEnvironmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Environment environment = 1;
  ValidateEnvironmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

