syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "EnvironmentWorkflowServiceProto";
option java_package = "com.acme.configuration.v1";

// Runs the long-lived workflow that takes an environment from start to finish.
service EnvironmentWorkflowService {
  // Starts an environment.
  rpc StartEnvironmentWorkflow(StartEnvironmentWorkflowRequest) returns (StartEnvironmentWorkflowResponse);

  // Advances an environment.
  rpc AdvanceEnvironmentWorkflow(AdvanceEnvironmentWorkflowRequest) returns (AdvanceEnvironmentWorkflowResponse);

  // Cancels an environment.
  rpc CancelEnvironmentWorkflow(CancelEnvironmentWorkflowRequest) returns (CancelEnvironmentWorkflowResponse);

  // Retrys an environment.
  rpc RetryEnvironmentWorkflow(RetryEnvironmentWorkflowRequest) returns (RetryEnvironmentWorkflowResponse);

  // Pauses an environment.
  rpc PauseEnvironmentWorkflow(PauseEnvironmentWorkflowRequest) returns (PauseEnvironmentWorkflowResponse);

  // Resumes an environment.
  rpc ResumeEnvironmentWorkflow(ResumeEnvironmentWorkflowRequest) returns (ResumeEnvironmentWorkflowResponse);

  // Lists environments a page at a time.
  rpc ListEnvironmentWorkflows(ListEnvironmentWorkflowsRequest) returns (ListEnvironmentWorkflowsResponse);

  // Signals an environment.
  rpc SignalEnvironmentWorkflow(SignalEnvironmentWorkflowRequest) returns (SignalEnvironmentWorkflowResponse);
}

// The request of `StartEnvironmentWorkflow`.
message StartEnvironmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string environment_id = 2;
  Environment environment = 3;
  StartEnvironmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEnvironmentWorkflow`.
message StartEnvironmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Environment environment = 1;
  StartEnvironmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

