syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigChangeValidationServiceProto";
option java_package = "com.acme.configuration.v1";

// Checks config changes against the rules before anything acts on them.
service ConfigChangeValidationService {
  // Validates a config change.
  rpc ValidateConfigChange(ValidateConfigChangeRequest) returns (ValidateConfigChangeResponse);

  // Previews a config change.
  rpc PreviewConfigChange(PreviewConfigChangeRequest) returns (PreviewConfigChangeResponse);

  // Checks a config change.
  rpc CheckConfigChangeEligibility(CheckConfigChangeEligibilityRequest) returns (CheckConfigChangeEligibilityResponse);

  // Normalizes a config change.
  rpc NormalizeConfigChange(NormalizeConfigChangeRequest) returns (NormalizeConfigChangeResponse);

  // Explains a config change.
  rpc ExplainConfigChangeDecision(ExplainConfigChangeDecisionRequest) returns (ExplainConfigChangeDecisionResponse);

  // Scores a config change.
  rpc ScoreConfigChange(ScoreConfigChangeRequest) returns (ScoreConfigChangeResponse);

  // Lints a config change.
  rpc LintConfigChanges(LintConfigChangesRequest) returns (LintConfigChangesResponse);

  // Returns a config change.
  rpc GetConfigChangeRules(GetConfigChangeRulesRequest) returns (GetConfigChangeRulesResponse);
}

// The request of `ValidateConfigChange`.
message ValidateConfigChangeRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string config_change_id = 2;
  ConfigChange config_change = 3;
  ValidateConfigChangeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateConfigChange`.
message ValidateConfigChangeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ConfigChange config_change = 1;
  ValidateConfigChangeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

