// The request of `PurgeFeatureFlag`.
message PurgeFeatureFlagRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeFeatureFlag`.
message PurgeFeatureFlagResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

