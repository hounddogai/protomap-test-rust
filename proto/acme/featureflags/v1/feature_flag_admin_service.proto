syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagAdminServiceProto";
option java_package = "com.acme.featureflags.v1";

// Operator actions on feature flags that support staff run by hand.
service FeatureFlagAdminService {
  // Archives a feature flag.
  rpc ArchiveFeatureFlag(ArchiveFeatureFlagRequest) returns (ArchiveFeatureFlagResponse);

  // Restores a feature flag.
  rpc RestoreFeatureFlag(RestoreFeatureFlagRequest) returns (RestoreFeatureFlagResponse);

  // Deletes a feature flag.
  rpc PurgeFeatureFlag(PurgeFeatureFlagRequest) returns (PurgeFeatureFlagResponse);

  // Reassigns a feature flag.
  rpc ReassignFeatureFlag(ReassignFeatureFlagRequest) returns (ReassignFeatureFlagResponse);

  // Locks a feature flag.
  rpc LockFeatureFlag(LockFeatureFlagRequest) returns (LockFeatureFlagResponse);

  // Unlocks a feature flag.
  rpc UnlockFeatureFlag(UnlockFeatureFlagRequest) returns (UnlockFeatureFlagResponse);

  // Transfers a feature flag.
  rpc TransferFeatureFlag(TransferFeatureFlagRequest) returns (TransferFeatureFlagResponse);

  // Repairs a feature flag.
  rpc RepairFeatureFlag(RepairFeatureFlagRequest) returns (RepairFeatureFlagResponse);

  // Returns a feature flag.
  rpc InspectFeatureFlag(InspectFeatureFlagRequest) returns (InspectFeatureFlagResponse);
}

// The request of `ArchiveFeatureFlag`.
message ArchiveFeatureFlagRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  ArchiveFeatureFlagRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveFeatureFlag`.
message ArchiveFeatureFlagResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  ArchiveFeatureFlagResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreFeatureFlag`.
message RestoreFeatureFlagRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
