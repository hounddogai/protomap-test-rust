syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutValidationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Checks flag rollouts against the rules before anything acts on them.
service FlagRolloutValidationService {
  // Validates a flag rollout.
  rpc ValidateFlagRollout(ValidateFlagRolloutRequest) returns (ValidateFlagRolloutResponse);

  // Previews a flag rollout.
  rpc PreviewFlagRollout(PreviewFlagRolloutRequest) returns (PreviewFlagRolloutResponse);

  // Checks a flag rollout.
  rpc CheckFlagRolloutEligibility(CheckFlagRolloutEligibilityRequest) returns (CheckFlagRolloutEligibilityResponse);

  // Normalizes a flag rollout.
  rpc NormalizeFlagRollout(NormalizeFlagRolloutRequest) returns (NormalizeFlagRolloutResponse);

  // Explains a flag rollout.
  rpc ExplainFlagRolloutDecision(ExplainFlagRolloutDecisionRequest) returns (ExplainFlagRolloutDecisionResponse);

  // Scores a flag rollout.
  rpc ScoreFlagRollout(ScoreFlagRolloutRequest) returns (ScoreFlagRolloutResponse);

  // Lints a flag rollout.
  rpc LintFlagRollouts(LintFlagRolloutsRequest) returns (LintFlagRolloutsResponse);

  // Returns a flag rollout.
  rpc GetFlagRolloutRules(GetFlagRolloutRulesRequest) returns (GetFlagRolloutRulesResponse);
}

// The request of `ValidateFlagRollout`.
message ValidateFlagRolloutRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  FlagRollout flag_rollout = 3;
  ValidateFlagRolloutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFlagRollout`.
message ValidateFlagRolloutResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  ValidateFlagRolloutResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

