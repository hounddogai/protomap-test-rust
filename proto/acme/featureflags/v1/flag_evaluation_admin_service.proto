// The request of `PurgeFlagEvaluation`.
message PurgeFlagEvaluationRequest {
  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeFlagEvaluation`.
message PurgeFlagEvaluationResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

