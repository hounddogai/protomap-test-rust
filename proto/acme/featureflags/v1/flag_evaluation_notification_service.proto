syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagEvaluationNotificationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Tells the people who follow a flag evaluation what changed.
service FlagEvaluationNotificationService {
  // Subscribes a flag evaluation.
  rpc SubscribeFlagEvaluationUpdates(SubscribeFlagEvaluationUpdatesRequest) returns (SubscribeFlagEvaluationUpdatesResponse);

  // Unsubscribes a flag evaluation.
  rpc UnsubscribeFlagEvaluationUpdates(UnsubscribeFlagEvaluationUpdatesRequest) returns (UnsubscribeFlagEvaluationUpdatesResponse);

  // Notifys a flag evaluation.
  rpc NotifyFlagEvaluationWatchers(NotifyFlagEvaluationWatchersRequest) returns (NotifyFlagEvaluationWatchersResponse);

  // Lists flag evaluations a page at a time.
  rpc ListFlagEvaluationSubscriptions(ListFlagEvaluationSubscriptionsRequest) returns (ListFlagEvaluationSubscriptionsResponse);

  // Sends a flag evaluation.
  rpc SendFlagEvaluationTestNotice(SendFlagEvaluationTestNoticeRequest) returns (SendFlagEvaluationTestNoticeResponse);

  // Returns a flag evaluation.
  rpc GetFlagEvaluationPreferences(GetFlagEvaluationPreferencesRequest) returns (GetFlagEvaluationPreferencesResponse);

  // Streams the changes of flag evaluations as they happen.
  rpc StreamFlagEvaluationNotices(StreamFlagEvaluationNoticesRequest) returns (stream StreamFlagEvaluationNoticesResponse);
}

// The request of `SubscribeFlagEvaluationUpdates`.
message SubscribeFlagEvaluationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  SubscribeFlagEvaluationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeFlagEvaluationUpdates`.
message SubscribeFlagEvaluationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  SubscribeFlagEvaluationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeFlagEvaluationUpdates`.
message UnsubscribeFlagEvaluationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  UnsubscribeFlagEvaluationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeFlagEvaluationUpdates`.
message UnsubscribeFlagEvaluationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  UnsubscribeFlagEvaluationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyFlagEvaluationWatchers`.
message NotifyFlagEvaluationWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
