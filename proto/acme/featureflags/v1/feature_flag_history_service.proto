syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagHistoryServiceProto";
option java_package = "com.acme.featureflags.v1";

// Keeps every version of a feature flag and restores earlier ones.
service FeatureFlagHistoryService {
  // Records a feature flag.
  rpc RecordFeatureFlagVersion(RecordFeatureFlagVersionRequest) returns (RecordFeatureFlagVersionResponse);

  // Lists feature flags a page at a time.
  rpc ListFeatureFlagVersions(ListFeatureFlagVersionsRequest) returns (ListFeatureFlagVersionsResponse);

  // Returns a feature flag.
  rpc GetFeatureFlagVersion(GetFeatureFlagVersionRequest) returns (GetFeatureFlagVersionResponse);

  // Compares a feature flag.
  rpc CompareFeatureFlagVersions(CompareFeatureFlagVersionsRequest) returns (CompareFeatureFlagVersionsResponse);

  // Reverts a feature flag.
  rpc RevertFeatureFlag(RevertFeatureFlagRequest) returns (RevertFeatureFlagResponse);

  // Annotates a feature flag.
  rpc AnnotateFeatureFlagVersion(AnnotateFeatureFlagVersionRequest) returns (AnnotateFeatureFlagVersionResponse);

  // Deletes a feature flag.
  rpc PruneFeatureFlagVersions(PruneFeatureFlagVersionsRequest) returns (PruneFeatureFlagVersionsResponse);
}

// The request of `RecordFeatureFlagVersion`.
message RecordFeatureFlagVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  RecordFeatureFlagVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordFeatureFlagVersion`.
message RecordFeatureFlagVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  RecordFeatureFlagVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFeatureFlagVersions`.
message ListFeatureFlagVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureFlagStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFeatureFlagVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFeatureFlagVersions`.
message ListFeatureFlagVersionsResponse {
  repeated FeatureFlag feature_flags = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFeatureFlagVersion`.
message GetFeatureFlagVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFeatureFlagVersion`.
message GetFeatureFlagVersionResponse {
  FeatureFlag feature_flag = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareFeatureFlagVersions`.
message CompareFeatureFlagVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  CompareFeatureFlagVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareFeatureFlagVersions`.
message CompareFeatureFlagVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  CompareFeatureFlagVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertFeatureFlag`.
message RevertFeatureFlagRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  RevertFeatureFlagRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertFeatureFlag`.
message RevertFeatureFlagResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  RevertFeatureFlagResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateFeatureFlagVersion`.
message AnnotateFeatureFlagVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  AnnotateFeatureFlagVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateFeatureFlagVersion`.
message AnnotateFeatureFlagVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  AnnotateFeatureFlagVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneFeatureFlagVersions`.
message PruneFeatureFlagVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneFeatureFlagVersions`.
message PruneFeatureFlagVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
