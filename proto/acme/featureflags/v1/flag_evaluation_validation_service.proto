syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagEvaluationValidationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Checks flag evaluations against the rules before anything acts on them.
service FlagEvaluationValidationService {
  // Validates a flag evaluation.
  rpc ValidateFlagEvaluation(ValidateFlagEvaluationRequest) returns (ValidateFlagEvaluationResponse);

  // Previews a flag evaluation.
  rpc PreviewFlagEvaluation(PreviewFlagEvaluationRequest) returns (PreviewFlagEvaluationResponse);

  // Checks a flag evaluation.
  rpc CheckFlagEvaluationEligibility(CheckFlagEvaluationEligibilityRequest) returns (CheckFlagEvaluationEligibilityResponse);

  // Normalizes a flag evaluation.
  rpc NormalizeFlagEvaluation(NormalizeFlagEvaluationRequest) returns (NormalizeFlagEvaluationResponse);

  // Explains a flag evaluation.
  rpc ExplainFlagEvaluationDecision(ExplainFlagEvaluationDecisionRequest) returns (ExplainFlagEvaluationDecisionResponse);

  // Scores a flag evaluation.
  rpc ScoreFlagEvaluation(ScoreFlagEvaluationRequest) returns (ScoreFlagEvaluationResponse);

  // Lints a flag evaluation.
  rpc LintFlagEvaluations(LintFlagEvaluationsRequest) returns (LintFlagEvaluationsResponse);

  // Returns a flag evaluation.
  rpc GetFlagEvaluationRules(GetFlagEvaluationRulesRequest) returns (GetFlagEvaluationRulesResponse);
}

// The request of `ValidateFlagEvaluation`.
message ValidateFlagEvaluationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  FlagEvaluation flag_evaluation = 3;
  ValidateFlagEvaluationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFlagEvaluation`.
message ValidateFlagEvaluationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  ValidateFlagEvaluationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

