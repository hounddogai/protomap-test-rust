syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagEvaluationSyncServiceProto";
option java_package = "com.acme.featureflags.v1";

// Keeps flag evaluations in step with the systems of record in other regions.
service FlagEvaluationSyncService {
  // Syncs a flag evaluation.
  rpc SyncFlagEvaluations(SyncFlagEvaluationsRequest) returns (SyncFlagEvaluationsResponse);

  // Pushs a flag evaluation.
  rpc PushFlagEvaluation(PushFlagEvaluationRequest) returns (PushFlagEvaluationResponse);

  // Pulls a flag evaluation.
  rpc PullFlagEvaluations(PullFlagEvaluationsRequest) returns (PullFlagEvaluationsResponse);

  // Reconciles a flag evaluation.
  rpc ReconcileFlagEvaluations(ReconcileFlagEvaluationsRequest) returns (ReconcileFlagEvaluationsResponse);

  // Exchanges changes of flag evaluations with a peer.
  rpc StreamFlagEvaluationChanges(stream StreamFlagEvaluationChangesRequest) returns (stream StreamFlagEvaluationChangesResponse);

  // Resolves a flag evaluation.
  rpc ResolveFlagEvaluationConflict(ResolveFlagEvaluationConflictRequest) returns (ResolveFlagEvaluationConflictResponse);

  // Returns a flag evaluation.
  rpc GetFlagEvaluationSyncState(GetFlagEvaluationSyncStateRequest) returns (GetFlagEvaluationSyncStateResponse);

  // Lists flag evaluations a page at a time.
  rpc ListFlagEvaluationConflicts(ListFlagEvaluationConflictsRequest) returns (ListFlagEvaluationConflictsResponse);
}

// The request of `SyncFlagEvaluations`.
message SyncFlagEvaluationsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  FlagEvaluation flag_evaluation = 3;
  SyncFlagEvaluationsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFlagEvaluations`.
message SyncFlagEvaluationsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  SyncFlagEvaluationsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

