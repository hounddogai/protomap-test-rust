syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagSyncServiceProto";
option java_package = "com.acme.featureflags.v1";

// Keeps feature flags in step with the systems of record in other regions.
service FeatureFlagSyncService {
  // Syncs a feature flag.
  rpc SyncFeatureFlags(SyncFeatureFlagsRequest) returns (SyncFeatureFlagsResponse);

  // Pushs a feature flag.
  rpc PushFeatureFlag(PushFeatureFlagRequest) returns (PushFeatureFlagResponse);

  // Pulls a feature flag.
  rpc PullFeatureFlags(PullFeatureFlagsRequest) returns (PullFeatureFlagsResponse);

  // Reconciles a feature flag.
  rpc ReconcileFeatureFlags(ReconcileFeatureFlagsRequest) returns (ReconcileFeatureFlagsResponse);

  // Exchanges changes of feature flags with a peer.
  rpc StreamFeatureFlagChanges(stream StreamFeatureFlagChangesRequest) returns (stream StreamFeatureFlagChangesResponse);

  // Resolves a feature flag.
  rpc ResolveFeatureFlagConflict(ResolveFeatureFlagConflictRequest) returns (ResolveFeatureFlagConflictResponse);

  // Lists feature flags a page at a time.
  rpc ListFeatureFlagConflicts(ListFeatureFlagConflictsRequest) returns (ListFeatureFlagConflictsResponse);
}

// The request of `SyncFeatureFlags`.
message SyncFeatureFlagsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_flag_id = 2;
  FeatureFlag feature_flag = 3;
  SyncFeatureFlagsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFeatureFlags`.
message SyncFeatureFlagsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureFlag feature_flag = 1;
  SyncFeatureFlagsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFeatureFlag`.
message PushFeatureFlagRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
