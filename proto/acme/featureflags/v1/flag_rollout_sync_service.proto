syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutSyncServiceProto";
option java_package = "com.acme.featureflags.v1";

// Keeps flag rollouts in step with the systems of record in other regions.
service FlagRolloutSyncService {
  // Syncs a flag rollout.
  rpc SyncFlagRollouts(SyncFlagRolloutsRequest) returns (SyncFlagRolloutsResponse);

  // Pushs a flag rollout.
  rpc PushFlagRollout(PushFlagRolloutRequest) returns (PushFlagRolloutResponse);

  // Pulls a flag rollout.
  rpc PullFlagRollouts(PullFlagRolloutsRequest) returns (PullFlagRolloutsResponse);

  // Reconciles a flag rollout.
  rpc ReconcileFlagRollouts(ReconcileFlagRolloutsRequest) returns (ReconcileFlagRolloutsResponse);

  // Exchanges changes of flag rollouts with a peer.
  rpc StreamFlagRolloutChanges(stream StreamFlagRolloutChangesRequest) returns (stream StreamFlagRolloutChangesResponse);

  // Resolves a flag rollout.
  rpc ResolveFlagRolloutConflict(ResolveFlagRolloutConflictRequest) returns (ResolveFlagRolloutConflictResponse);

  // Returns a flag rollout.
  rpc GetFlagRolloutSyncState(GetFlagRolloutSyncStateRequest) returns (GetFlagRolloutSyncStateResponse);

  // Lists flag rollouts a page at a time.
  rpc ListFlagRolloutConflicts(ListFlagRolloutConflictsRequest) returns (ListFlagRolloutConflictsResponse);
}

// The request of `SyncFlagRollouts`.
message SyncFlagRolloutsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  FlagRollout flag_rollout = 3;
  SyncFlagRolloutsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFlagRollouts`.
message SyncFlagRolloutsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  SyncFlagRolloutsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFlagRollout`.
message PushFlagRolloutRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
