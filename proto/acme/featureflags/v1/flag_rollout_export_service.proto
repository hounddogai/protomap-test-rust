syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutExportServiceProto";
option java_package = "com.acme.featureflags.v1";

// Exports flag rollouts to files and other systems.
service FlagRolloutExportService {
  // Streams every matching flag rollout.
  rpc StreamFlagRolloutExport(StreamFlagRolloutExportRequest) returns (stream StreamFlagRolloutExportResponse);

  // Returns a flag rollout.
  rpc GetFlagRolloutExport(GetFlagRolloutExportRequest) returns (GetFlagRolloutExportResponse);

  // Cancels a flag rollout.
  rpc CancelFlagRolloutExport(CancelFlagRolloutExportRequest) returns (CancelFlagRolloutExportResponse);

  // Lists flag rollouts a page at a time.
  rpc ListFlagRolloutExports(ListFlagRolloutExportsRequest) returns (ListFlagRolloutExportsResponse);

  // Schedules a flag rollout.
  rpc ScheduleFlagRolloutExport(ScheduleFlagRolloutExportRequest) returns (ScheduleFlagRolloutExportResponse);

  // Retrys a flag rollout.
  rpc RetryFlagRolloutExport(RetryFlagRolloutExportRequest) returns (RetryFlagRolloutExportResponse);

  // Shares a flag rollout.
  rpc ShareFlagRolloutExport(ShareFlagRolloutExportRequest) returns (ShareFlagRolloutExportResponse);
}

// The request of `StreamFlagRolloutExport`.
message StreamFlagRolloutExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFlagRolloutExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamFlagRolloutExport`.
message StreamFlagRolloutExportResponse {
  FlagRollout flag_rollout = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFlagRolloutExport`.
message GetFlagRolloutExportRequest {
  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFlagRolloutExport`.
message GetFlagRolloutExportResponse {
  FlagRollout flag_rollout = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFlagRolloutExport`.
message CancelFlagRolloutExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  CancelFlagRolloutExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFlagRolloutExport`.
message CancelFlagRolloutExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  CancelFlagRolloutExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFlagRolloutExports`.
message ListFlagRolloutExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFlagRolloutExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFlagRolloutExports`.
message ListFlagRolloutExportsResponse {
  repeated FlagRollout flag_rollouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleFlagRolloutExport`.
message ScheduleFlagRolloutExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  ScheduleFlagRolloutExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFlagRolloutExport`.
message ScheduleFlagRolloutExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryFlagRolloutExport`.
message RetryFlagRolloutExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  FlagRollout flag_rollout = 3;
  RetryFlagRolloutExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFlagRolloutExport`.
message RetryFlagRolloutExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  RetryFlagRolloutExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFlagRolloutExport`.
message ShareFlagRolloutExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  ShareFlagRolloutExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFlagRolloutExport`.
message ShareFlagRolloutExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  ShareFlagRolloutExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
