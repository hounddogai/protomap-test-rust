syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagEvaluationExportServiceProto";
option java_package = "com.acme.featureflags.v1";

// Exports flag evaluations to files and other systems.
service FlagEvaluationExportService {
  // Streams every matching flag evaluation.
  rpc StreamFlagEvaluationExport(StreamFlagEvaluationExportRequest) returns (stream StreamFlagEvaluationExportResponse);

  // Returns a flag evaluation.
  rpc GetFlagEvaluationExport(GetFlagEvaluationExportRequest) returns (GetFlagEvaluationExportResponse);

  // Cancels a flag evaluation.
  rpc CancelFlagEvaluationExport(CancelFlagEvaluationExportRequest) returns (CancelFlagEvaluationExportResponse);

  // Lists flag evaluations a page at a time.
  rpc ListFlagEvaluationExports(ListFlagEvaluationExportsRequest) returns (ListFlagEvaluationExportsResponse);

  // Schedules a flag evaluation.
  rpc ScheduleFlagEvaluationExport(ScheduleFlagEvaluationExportRequest) returns (ScheduleFlagEvaluationExportResponse);

  // Retrys a flag evaluation.
  rpc RetryFlagEvaluationExport(RetryFlagEvaluationExportRequest) returns (RetryFlagEvaluationExportResponse);

  // Shares a flag evaluation.
  rpc ShareFlagEvaluationExport(ShareFlagEvaluationExportRequest) returns (ShareFlagEvaluationExportResponse);
}

// The request of `StreamFlagEvaluationExport`.
message StreamFlagEvaluationExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagEvaluationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFlagEvaluationExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamFlagEvaluationExport`.
message StreamFlagEvaluationExportResponse {
  FlagEvaluation flag_evaluation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFlagEvaluationExport`.
message GetFlagEvaluationExportRequest {
  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFlagEvaluationExport`.
message GetFlagEvaluationExportResponse {
  FlagEvaluation flag_evaluation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFlagEvaluationExport`.
message CancelFlagEvaluationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  CancelFlagEvaluationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFlagEvaluationExport`.
message CancelFlagEvaluationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  CancelFlagEvaluationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFlagEvaluationExports`.
message ListFlagEvaluationExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagEvaluationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFlagEvaluationExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFlagEvaluationExports`.
message ListFlagEvaluationExportsResponse {
  repeated FlagEvaluation flag_evaluations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleFlagEvaluationExport`.
message ScheduleFlagEvaluationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  ScheduleFlagEvaluationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFlagEvaluationExport`.
message ScheduleFlagEvaluationExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryFlagEvaluationExport`.
message RetryFlagEvaluationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  FlagEvaluation flag_evaluation = 3;
  RetryFlagEvaluationExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFlagEvaluationExport`.
message RetryFlagEvaluationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  RetryFlagEvaluationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFlagEvaluationExport`.
message ShareFlagEvaluationExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  ShareFlagEvaluationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFlagEvaluationExport`.
message ShareFlagEvaluationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagEvaluation flag_evaluation = 1;
  ShareFlagEvaluationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
