syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutCalculationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Computes the figures of a flag rollout, such as totals, taxes, and estimates.
service FlagRolloutCalculationService {
  // Calculates a flag rollout.
  rpc CalculateFlagRollout(CalculateFlagRolloutRequest) returns (CalculateFlagRolloutResponse);

  // Estimates a flag rollout.
  rpc EstimateFlagRollout(EstimateFlagRolloutRequest) returns (EstimateFlagRolloutResponse);

  // Compares a flag rollout.
  rpc CompareFlagRolloutOptions(CompareFlagRolloutOptionsRequest) returns (CompareFlagRolloutOptionsResponse);

  // Recalculates a flag rollout.
  rpc RecalculateFlagRollouts(RecalculateFlagRolloutsRequest) returns (RecalculateFlagRolloutsResponse);

  // Simulates a flag rollout.
  rpc SimulateFlagRollout(SimulateFlagRolloutRequest) returns (SimulateFlagRolloutResponse);

  // Explains a flag rollout.
  rpc ExplainFlagRolloutCalculation(ExplainFlagRolloutCalculationRequest) returns (ExplainFlagRolloutCalculationResponse);

  // Returns a flag rollout.
  rpc GetFlagRolloutRates(GetFlagRolloutRatesRequest) returns (GetFlagRolloutRatesResponse);
}

// The request of `CalculateFlagRollout`.
message CalculateFlagRolloutRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  FlagRollout flag_rollout = 3;
  CalculateFlagRolloutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFlagRollout`.
message CalculateFlagRolloutResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFlagRolloutResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FlagRollout flag_rollout = 1;
  CalculateFlagRolloutResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

