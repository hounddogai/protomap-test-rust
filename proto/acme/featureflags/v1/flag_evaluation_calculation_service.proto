syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagEvaluationCalculationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Computes the figures of a flag evaluation, such as totals, taxes, and estimates.
service FlagEvaluationCalculationService {
  // Calculates a flag evaluation.
  rpc CalculateFlagEvaluation(CalculateFlagEvaluationRequest) returns (CalculateFlagEvaluationResponse);

  // Estimates a flag evaluation.
  rpc EstimateFlagEvaluation(EstimateFlagEvaluationRequest) returns (EstimateFlagEvaluationResponse);

  // Quotes a flag evaluation.
  rpc QuoteFlagEvaluation(QuoteFlagEvaluationRequest) returns (QuoteFlagEvaluationResponse);

  // Compares a flag evaluation.
  rpc CompareFlagEvaluationOptions(CompareFlagEvaluationOptionsRequest) returns (CompareFlagEvaluationOptionsResponse);

  // Recalculates a flag evaluation.
  rpc RecalculateFlagEvaluations(RecalculateFlagEvaluationsRequest) returns (RecalculateFlagEvaluationsResponse);

  // Simulates a flag evaluation.
  rpc SimulateFlagEvaluation(SimulateFlagEvaluationRequest) returns (SimulateFlagEvaluationResponse);

  // Explains a flag evaluation.
  rpc ExplainFlagEvaluationCalculation(ExplainFlagEvaluationCalculationRequest) returns (ExplainFlagEvaluationCalculationResponse);

  // Returns a flag evaluation.
  rpc GetFlagEvaluationRates(GetFlagEvaluationRatesRequest) returns (GetFlagEvaluationRatesResponse);
}

// The request of `CalculateFlagEvaluation`.
message CalculateFlagEvaluationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_evaluation_id = 2;
  FlagEvaluation flag_evaluation = 3;
  CalculateFlagEvaluationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFlagEvaluation`.
message CalculateFlagEvaluationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFlagEvaluationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FlagEvaluation flag_evaluation = 1;
  CalculateFlagEvaluationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

