syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutNotificationServiceProto";
option java_package = "com.acme.featureflags.v1";

// Tells the people who follow a flag rollout what changed.
service FlagRolloutNotificationService {
  // Subscribes a flag rollout.
  rpc SubscribeFlagRolloutUpdates(SubscribeFlagRolloutUpdatesRequest) returns (SubscribeFlagRolloutUpdatesResponse);

  // Unsubscribes a flag rollout.
  rpc UnsubscribeFlagRolloutUpdates(UnsubscribeFlagRolloutUpdatesRequest) returns (UnsubscribeFlagRolloutUpdatesResponse);

  // Notifys a flag rollout.
  rpc NotifyFlagRolloutWatchers(NotifyFlagRolloutWatchersRequest) returns (NotifyFlagRolloutWatchersResponse);

  // Lists flag rollouts a page at a time.
  rpc ListFlagRolloutSubscriptions(ListFlagRolloutSubscriptionsRequest) returns (ListFlagRolloutSubscriptionsResponse);

  // Sends a flag rollout.
  rpc SendFlagRolloutTestNotice(SendFlagRolloutTestNoticeRequest) returns (SendFlagRolloutTestNoticeResponse);

  // Returns a flag rollout.
  rpc GetFlagRolloutPreferences(GetFlagRolloutPreferencesRequest) returns (GetFlagRolloutPreferencesResponse);

  // Streams the changes of flag rollouts as they happen.
  rpc StreamFlagRolloutNotices(StreamFlagRolloutNoticesRequest) returns (stream StreamFlagRolloutNoticesResponse);
}

// The request of `SubscribeFlagRolloutUpdates`.
message SubscribeFlagRolloutUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  SubscribeFlagRolloutUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeFlagRolloutUpdates`.
message SubscribeFlagRolloutUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  SubscribeFlagRolloutUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeFlagRolloutUpdates`.
message UnsubscribeFlagRolloutUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  UnsubscribeFlagRolloutUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeFlagRolloutUpdates`.
message UnsubscribeFlagRolloutUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FlagRollout flag_rollout = 1;
  UnsubscribeFlagRolloutUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyFlagRolloutWatchers`.
message NotifyFlagRolloutWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
