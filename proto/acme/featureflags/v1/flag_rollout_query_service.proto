syntax = "proto3";

package acme.featureflags.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featureflags/v1/featureflags.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featureflags.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featureflags/v1;featureflagsv1";
option java_multiple_files = true;
option java_outer_classname = "FlagRolloutQueryServiceProto";
option java_package = "com.acme.featureflags.v1";

// Answers read-only questions about flag rollouts, for screens and reports.
service FlagRolloutQueryService {
  // Returns a flag rollout.
  rpc LookupFlagRollout(LookupFlagRolloutRequest) returns (LookupFlagRolloutResponse);

  // Lists flag rollouts a page at a time.
  rpc BrowseFlagRollouts(BrowseFlagRolloutsRequest) returns (BrowseFlagRolloutsResponse);

  // Lists flag rollouts a page at a time.
  rpc FindFlagRollouts(FindFlagRolloutsRequest) returns (FindFlagRolloutsResponse);

  // Streams every matching flag rollout.
  rpc ExportFlagRollouts(ExportFlagRolloutsRequest) returns (stream ExportFlagRolloutsResponse);

  // Summarizes a flag rollout.
  rpc SummarizeFlagRollouts(SummarizeFlagRolloutsRequest) returns (SummarizeFlagRolloutsResponse);

  // Lists flag rollouts a page at a time.
  rpc SuggestFlagRollouts(SuggestFlagRolloutsRequest) returns (SuggestFlagRolloutsResponse);

  // Returns a flag rollout.
  rpc PeekFlagRollout(PeekFlagRolloutRequest) returns (PeekFlagRolloutResponse);
}

// The request of `LookupFlagRollout`.
message LookupFlagRolloutRequest {
  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFlagRollout`.
message LookupFlagRolloutResponse {
  FlagRollout flag_rollout = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFlagRollouts`.
message BrowseFlagRolloutsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFlagRolloutsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFlagRollouts`.
message BrowseFlagRolloutsResponse {
  repeated FlagRollout flag_rollouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindFlagRollouts`.
message FindFlagRolloutsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindFlagRolloutsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindFlagRollouts`.
message FindFlagRolloutsResponse {
  repeated FlagRollout flag_rollouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFlagRollouts`.
message ExportFlagRolloutsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFlagRolloutsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFlagRollouts`.
message ExportFlagRolloutsResponse {
  FlagRollout flag_rollout = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFlagRollouts`.
message SummarizeFlagRolloutsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  SummarizeFlagRolloutsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFlagRollouts`.
message SummarizeFlagRolloutsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestFlagRollouts`.
message SuggestFlagRolloutsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FlagRolloutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFlagRolloutsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestFlagRollouts`.
message SuggestFlagRolloutsResponse {
  repeated FlagRollout flag_rollouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekFlagRollout`.
message PeekFlagRolloutRequest {
  acme.common.v1.RequestContext context = 1;
  string flag_rollout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFlagRollout`.
message PeekFlagRolloutResponse {
  FlagRollout flag_rollout = 1;
  acme.common.v1.OperationResult result = 2;
}
