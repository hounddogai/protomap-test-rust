syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "AccessPolicyHistoryServiceProto";
option java_package = "com.acme.authorization.v1";

// Keeps every version of an access policy and restores earlier ones.
service AccessPolicyHistoryService {
  // Records an access policy.
  rpc RecordAccessPolicyVersion(RecordAccessPolicyVersionRequest) returns (RecordAccessPolicyVersionResponse);

  // Lists access policies a page at a time.
  rpc ListAccessPolicyVersions(ListAccessPolicyVersionsRequest) returns (ListAccessPolicyVersionsResponse);

  // Returns an access policy.
  rpc GetAccessPolicyVersion(GetAccessPolicyVersionRequest) returns (GetAccessPolicyVersionResponse);

  // Compares an access policy.
  rpc CompareAccessPolicyVersions(CompareAccessPolicyVersionsRequest) returns (CompareAccessPolicyVersionsResponse);

  // Reverts an access policy.
  rpc RevertAccessPolicy(RevertAccessPolicyRequest) returns (RevertAccessPolicyResponse);

  // Annotates an access policy.
  rpc AnnotateAccessPolicyVersion(AnnotateAccessPolicyVersionRequest) returns (AnnotateAccessPolicyVersionResponse);

  // Deletes an access policy.
  rpc PruneAccessPolicyVersions(PruneAccessPolicyVersionsRequest) returns (PruneAccessPolicyVersionsResponse);
}

// The request of `RecordAccessPolicyVersion`.
message RecordAccessPolicyVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  RecordAccessPolicyVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordAccessPolicyVersion`.
message RecordAccessPolicyVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  RecordAccessPolicyVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAccessPolicyVersions`.
message ListAccessPolicyVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AccessPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAccessPolicyVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAccessPolicyVersions`.
message ListAccessPolicyVersionsResponse {
  repeated AccessPolicy access_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetAccessPolicyVersion`.
message GetAccessPolicyVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAccessPolicyVersion`.
message GetAccessPolicyVersionResponse {
  AccessPolicy access_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareAccessPolicyVersions`.
message CompareAccessPolicyVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  CompareAccessPolicyVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareAccessPolicyVersions`.
message CompareAccessPolicyVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  CompareAccessPolicyVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertAccessPolicy`.
message RevertAccessPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  RevertAccessPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertAccessPolicy`.
message RevertAccessPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  RevertAccessPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateAccessPolicyVersion`.
message AnnotateAccessPolicyVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  AnnotateAccessPolicyVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateAccessPolicyVersion`.
message AnnotateAccessPolicyVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  AnnotateAccessPolicyVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneAccessPolicyVersions`.
message PruneAccessPolicyVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneAccessPolicyVersions`.
message PruneAccessPolicyVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
