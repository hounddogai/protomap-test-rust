syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "RoleBindingHistoryServiceProto";
option java_package = "com.acme.authorization.v1";

// Keeps every version of a role binding and restores earlier ones.
service RoleBindingHistoryService {
  // Records a role binding.
  rpc RecordRoleBindingVersion(RecordRoleBindingVersionRequest) returns (RecordRoleBindingVersionResponse);

  // Lists role bindings a page at a time.
  rpc ListRoleBindingVersions(ListRoleBindingVersionsRequest) returns (ListRoleBindingVersionsResponse);

  // Returns a role binding.
  rpc GetRoleBindingVersion(GetRoleBindingVersionRequest) returns (GetRoleBindingVersionResponse);

  // Compares a role binding.
  rpc CompareRoleBindingVersions(CompareRoleBindingVersionsRequest) returns (CompareRoleBindingVersionsResponse);

  // Reverts a role binding.
  rpc RevertRoleBinding(RevertRoleBindingRequest) returns (RevertRoleBindingResponse);

  // Annotates a role binding.
  rpc AnnotateRoleBindingVersion(AnnotateRoleBindingVersionRequest) returns (AnnotateRoleBindingVersionResponse);

  // Deletes a role binding.
  rpc PruneRoleBindingVersions(PruneRoleBindingVersionsRequest) returns (PruneRoleBindingVersionsResponse);
}

// The request of `RecordRoleBindingVersion`.
message RecordRoleBindingVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  RoleBinding role_binding = 3;
  RecordRoleBindingVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordRoleBindingVersion`.
message RecordRoleBindingVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  RecordRoleBindingVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRoleBindingVersions`.
message ListRoleBindingVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRoleBindingVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRoleBindingVersions`.
message ListRoleBindingVersionsResponse {
  repeated RoleBinding role_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRoleBindingVersion`.
message GetRoleBindingVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRoleBindingVersion`.
message GetRoleBindingVersionResponse {
  RoleBinding role_binding = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareRoleBindingVersions`.
message CompareRoleBindingVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  RoleBinding role_binding = 3;
  CompareRoleBindingVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareRoleBindingVersions`.
message CompareRoleBindingVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  CompareRoleBindingVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertRoleBinding`.
message RevertRoleBindingRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  RoleBinding role_binding = 3;
  RevertRoleBindingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertRoleBinding`.
message RevertRoleBindingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  RevertRoleBindingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateRoleBindingVersion`.
message AnnotateRoleBindingVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  RoleBinding role_binding = 3;
  AnnotateRoleBindingVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateRoleBindingVersion`.
message AnnotateRoleBindingVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  AnnotateRoleBindingVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneRoleBindingVersions`.
message PruneRoleBindingVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneRoleBindingVersions`.
message PruneRoleBindingVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
