syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "RoleBindingNotificationServiceProto";
option java_package = "com.acme.authorization.v1";

// Tells the people who follow a role binding what changed.
service RoleBindingNotificationService {
  // Subscribes a role binding.
  rpc SubscribeRoleBindingUpdates(SubscribeRoleBindingUpdatesRequest) returns (SubscribeRoleBindingUpdatesResponse);

  // Unsubscribes a role binding.
  rpc UnsubscribeRoleBindingUpdates(UnsubscribeRoleBindingUpdatesRequest) returns (UnsubscribeRoleBindingUpdatesResponse);

  // Notifys a role binding.
  rpc NotifyRoleBindingWatchers(NotifyRoleBindingWatchersRequest) returns (NotifyRoleBindingWatchersResponse);

  // Lists role bindings a page at a time.
  rpc ListRoleBindingSubscriptions(ListRoleBindingSubscriptionsRequest) returns (ListRoleBindingSubscriptionsResponse);

  // Sends a role binding.
  rpc SendRoleBindingTestNotice(SendRoleBindingTestNoticeRequest) returns (SendRoleBindingTestNoticeResponse);

  // Returns a role binding.
  rpc GetRoleBindingPreferences(GetRoleBindingPreferencesRequest) returns (GetRoleBindingPreferencesResponse);

  // Streams the changes of role bindings as they happen.
  rpc StreamRoleBindingNotices(StreamRoleBindingNoticesRequest) returns (stream StreamRoleBindingNoticesResponse);
}

// The request of `SubscribeRoleBindingUpdates`.
message SubscribeRoleBindingUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  SubscribeRoleBindingUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeRoleBindingUpdates`.
message SubscribeRoleBindingUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  SubscribeRoleBindingUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeRoleBindingUpdates`.
message UnsubscribeRoleBindingUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  UnsubscribeRoleBindingUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeRoleBindingUpdates`.
message UnsubscribeRoleBindingUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoleBinding role_binding = 1;
  UnsubscribeRoleBindingUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

