syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "PermissionCheckNotificationServiceProto";
option java_package = "com.acme.authorization.v1";

// Tells the people who follow a permission check what changed.
service PermissionCheckNotificationService {
  // Subscribes a permission check.
  rpc SubscribePermissionCheckUpdates(SubscribePermissionCheckUpdatesRequest) returns (SubscribePermissionCheckUpdatesResponse);

  // Unsubscribes a permission check.
  rpc UnsubscribePermissionCheckUpdates(UnsubscribePermissionCheckUpdatesRequest) returns (UnsubscribePermissionCheckUpdatesResponse);

  // Notifys a permission check.
  rpc NotifyPermissionCheckWatchers(NotifyPermissionCheckWatchersRequest) returns (NotifyPermissionCheckWatchersResponse);

  // Lists permission checks a page at a time.
  rpc ListPermissionCheckSubscriptions(ListPermissionCheckSubscriptionsRequest) returns (ListPermissionCheckSubscriptionsResponse);

  // Sends a permission check.
  rpc SendPermissionCheckTestNotice(SendPermissionCheckTestNoticeRequest) returns (SendPermissionCheckTestNoticeResponse);

  // Returns a permission check.
  rpc GetPermissionCheckPreferences(GetPermissionCheckPreferencesRequest) returns (GetPermissionCheckPreferencesResponse);

  // Streams the changes of permission checks as they happen.
  rpc StreamPermissionCheckNotices(StreamPermissionCheckNoticesRequest) returns (stream StreamPermissionCheckNoticesResponse);
}

// The request of `SubscribePermissionCheckUpdates`.
message SubscribePermissionCheckUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  SubscribePermissionCheckUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribePermissionCheckUpdates`.
message SubscribePermissionCheckUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  SubscribePermissionCheckUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribePermissionCheckUpdates`.
message UnsubscribePermissionCheckUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  UnsubscribePermissionCheckUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribePermissionCheckUpdates`.
message UnsubscribePermissionCheckUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  UnsubscribePermissionCheckUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyPermissionCheckWatchers`.
message NotifyPermissionCheckWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
