  SendPermissionCheckTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPermissionCheckPreferences`.
message GetPermissionCheckPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPermissionCheckPreferences`.
message GetPermissionCheckPreferencesResponse {
  PermissionCheck permission_check = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamPermissionCheckNotices`.
message StreamPermissionCheckNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PermissionCheckStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPermissionCheckNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPermissionCheckNotices`.
message StreamPermissionCheckNoticesResponse {
  PermissionCheck permission_check = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
