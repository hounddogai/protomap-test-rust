syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "PermissionCheckAdminServiceProto";
option java_package = "com.acme.authorization.v1";

// Operator actions on permission checks that support staff run by hand.
service PermissionCheckAdminService {
  // Archives a permission check.
  rpc ArchivePermissionCheck(ArchivePermissionCheckRequest) returns (ArchivePermissionCheckResponse);

  // Restores a permission check.
  rpc RestorePermissionCheck(RestorePermissionCheckRequest) returns (RestorePermissionCheckResponse);

  // Deletes a permission check.
  rpc PurgePermissionCheck(PurgePermissionCheckRequest) returns (PurgePermissionCheckResponse);

  // Reassigns a permission check.
  rpc ReassignPermissionCheck(ReassignPermissionCheckRequest) returns (ReassignPermissionCheckResponse);

  // Locks a permission check.
  rpc LockPermissionCheck(LockPermissionCheckRequest) returns (LockPermissionCheckResponse);

  // Unlocks a permission check.
  rpc UnlockPermissionCheck(UnlockPermissionCheckRequest) returns (UnlockPermissionCheckResponse);

  // Transfers a permission check.
  rpc TransferPermissionCheck(TransferPermissionCheckRequest) returns (TransferPermissionCheckResponse);

  // Repairs a permission check.
  rpc RepairPermissionCheck(RepairPermissionCheckRequest) returns (RepairPermissionCheckResponse);

  // Returns a permission check.
  rpc InspectPermissionCheck(InspectPermissionCheckRequest) returns (InspectPermissionCheckResponse);
}

// The request of `ArchivePermissionCheck`.
message ArchivePermissionCheckRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  ArchivePermissionCheckRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchivePermissionCheck`.
message ArchivePermissionCheckResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  ArchivePermissionCheckResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestorePermissionCheck`.
message RestorePermissionCheckRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
