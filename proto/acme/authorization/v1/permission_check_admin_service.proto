}

// The request of `PurgePermissionCheck`.
message PurgePermissionCheckRequest {
  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgePermissionCheck`.
message PurgePermissionCheckResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

