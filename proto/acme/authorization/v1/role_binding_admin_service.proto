// The request of `PurgeRoleBinding`.
message PurgeRoleBindingRequest {
  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeRoleBinding`.
message PurgeRoleBindingResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

