    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  AccessPolicy access_policy = 3;
  RepairAccessPolicyRequest.Details details = 4;
