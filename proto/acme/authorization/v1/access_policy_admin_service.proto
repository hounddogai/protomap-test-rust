syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "AccessPolicyAdminServiceProto";
option java_package = "com.acme.authorization.v1";

// Operator actions on access policies that support staff run by hand.
service AccessPolicyAdminService {
  // Archives an access policy.
  rpc ArchiveAccessPolicy(ArchiveAccessPolicyRequest) returns (ArchiveAccessPolicyResponse);

  // Restores an access policy.
  rpc RestoreAccessPolicy(RestoreAccessPolicyRequest) returns (RestoreAccessPolicyResponse);

  // Deletes an access policy.
  rpc PurgeAccessPolicy(PurgeAccessPolicyRequest) returns (PurgeAccessPolicyResponse);

  // Reassigns an access policy.
  rpc ReassignAccessPolicy(ReassignAccessPolicyRequest) returns (ReassignAccessPolicyResponse);

  // Locks an access policy.
  rpc LockAccessPolicy(LockAccessPolicyRequest) returns (LockAccessPolicyResponse);

  // Unlocks an access policy.
  rpc UnlockAccessPolicy(UnlockAccessPolicyRequest) returns (UnlockAccessPolicyResponse);

  // Transfers an access policy.
  rpc TransferAccessPolicy(TransferAccessPolicyRequest) returns (TransferAccessPolicyResponse);

  // Repairs an access policy.
  rpc RepairAccessPolicy(RepairAccessPolicyRequest) returns (RepairAccessPolicyResponse);

  // Returns an access policy.
  rpc InspectAccessPolicy(InspectAccessPolicyRequest) returns (InspectAccessPolicyResponse);
}

// The request of `ArchiveAccessPolicy`.
message ArchiveAccessPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_policy_id = 2;
  ArchiveAccessPolicyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveAccessPolicy`.
message ArchiveAccessPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessPolicy access_policy = 1;
  ArchiveAccessPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreAccessPolicy`.
message RestoreAccessPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
