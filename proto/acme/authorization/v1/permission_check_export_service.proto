syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "PermissionCheckExportServiceProto";
option java_package = "com.acme.authorization.v1";

// Exports permission checks to files and other systems.
service PermissionCheckExportService {
  // Streams every matching permission check.
  rpc StreamPermissionCheckExport(StreamPermissionCheckExportRequest) returns (stream StreamPermissionCheckExportResponse);

  // Returns a permission check.
  rpc GetPermissionCheckExport(GetPermissionCheckExportRequest) returns (GetPermissionCheckExportResponse);

  // Cancels a permission check.
  rpc CancelPermissionCheckExport(CancelPermissionCheckExportRequest) returns (CancelPermissionCheckExportResponse);

  // Lists permission checks a page at a time.
  rpc ListPermissionCheckExports(ListPermissionCheckExportsRequest) returns (ListPermissionCheckExportsResponse);

  // Schedules a permission check.
  rpc SchedulePermissionCheckExport(SchedulePermissionCheckExportRequest) returns (SchedulePermissionCheckExportResponse);

  // Retrys a permission check.
  rpc RetryPermissionCheckExport(RetryPermissionCheckExportRequest) returns (RetryPermissionCheckExportResponse);

  // Shares a permission check.
  rpc SharePermissionCheckExport(SharePermissionCheckExportRequest) returns (SharePermissionCheckExportResponse);
}

// The request of `StreamPermissionCheckExport`.
message StreamPermissionCheckExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PermissionCheckStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPermissionCheckExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamPermissionCheckExport`.
message StreamPermissionCheckExportResponse {
  PermissionCheck permission_check = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetPermissionCheckExport`.
message GetPermissionCheckExportRequest {
  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPermissionCheckExport`.
message GetPermissionCheckExportResponse {
  PermissionCheck permission_check = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelPermissionCheckExport`.
message CancelPermissionCheckExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  CancelPermissionCheckExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelPermissionCheckExport`.
message CancelPermissionCheckExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  CancelPermissionCheckExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPermissionCheckExports`.
message ListPermissionCheckExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PermissionCheckStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPermissionCheckExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPermissionCheckExports`.
message ListPermissionCheckExportsResponse {
  repeated PermissionCheck permission_checks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SchedulePermissionCheckExport`.
message SchedulePermissionCheckExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  SchedulePermissionCheckExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePermissionCheckExport`.
message SchedulePermissionCheckExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryPermissionCheckExport`.
message RetryPermissionCheckExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  PermissionCheck permission_check = 3;
  RetryPermissionCheckExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryPermissionCheckExport`.
message RetryPermissionCheckExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  RetryPermissionCheckExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePermissionCheckExport`.
message SharePermissionCheckExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string permission_check_id = 2;
  SharePermissionCheckExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePermissionCheckExport`.
message SharePermissionCheckExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PermissionCheck permission_check = 1;
  SharePermissionCheckExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
