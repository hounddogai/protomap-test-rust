syntax = "proto3";

package acme.authorization.v1;

import "acme/authorization/v1/authorization.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Authorization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/authorization/v1;authorizationv1";
option java_multiple_files = true;
option java_outer_classname = "RoleBindingQueryServiceProto";
option java_package = "com.acme.authorization.v1";

// Answers read-only questions about role bindings, for screens and reports.
service RoleBindingQueryService {
  // Returns a role binding.
  rpc LookupRoleBinding(LookupRoleBindingRequest) returns (LookupRoleBindingResponse);

  // Lists role bindings a page at a time.
  rpc BrowseRoleBindings(BrowseRoleBindingsRequest) returns (BrowseRoleBindingsResponse);

  // Counts role bindings by status.
  rpc CountRoleBindings(CountRoleBindingsRequest) returns (CountRoleBindingsResponse);

  // Returns several role bindings at once.
  rpc ResolveRoleBindings(ResolveRoleBindingsRequest) returns (ResolveRoleBindingsResponse);

  // Streams every matching role binding.
  rpc ExportRoleBindings(ExportRoleBindingsRequest) returns (stream ExportRoleBindingsResponse);

  // Summarizes a role binding.
  rpc SummarizeRoleBindings(SummarizeRoleBindingsRequest) returns (SummarizeRoleBindingsResponse);

  // Lists role bindings a page at a time.
  rpc SuggestRoleBindings(SuggestRoleBindingsRequest) returns (SuggestRoleBindingsResponse);
}

// The request of `LookupRoleBinding`.
message LookupRoleBindingRequest {
  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRoleBinding`.
message LookupRoleBindingResponse {
  RoleBinding role_binding = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRoleBindings`.
message BrowseRoleBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRoleBindingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRoleBindings`.
message BrowseRoleBindingsResponse {
  repeated RoleBinding role_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRoleBindings`.
message CountRoleBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRoleBindingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRoleBindings`.
message CountRoleBindingsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRoleBindings`.
message ResolveRoleBindingsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string role_binding_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveRoleBindings`.
message ResolveRoleBindingsResponse {
  repeated RoleBinding role_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportRoleBindings`.
message ExportRoleBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportRoleBindingsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportRoleBindings`.
message ExportRoleBindingsResponse {
  RoleBinding role_binding = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeRoleBindings`.
message SummarizeRoleBindingsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string role_binding_id = 2;
  SummarizeRoleBindingsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRoleBindings`.
message SummarizeRoleBindingsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestRoleBindings`.
message SuggestRoleBindingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoleBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestRoleBindingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestRoleBindings`.
message SuggestRoleBindingsResponse {
  repeated RoleBinding role_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
