syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CsrWorkflowServiceProto";
option java_package = "com.acme.certificates.v1";

// Runs the long-lived workflow that takes a csr from start to finish.
service CsrWorkflowService {
  // Starts a csr.
  rpc StartCsrWorkflow(StartCsrWorkflowRequest) returns (StartCsrWorkflowResponse);

  // Advances a csr.
  rpc AdvanceCsrWorkflow(AdvanceCsrWorkflowRequest) returns (AdvanceCsrWorkflowResponse);

  // Cancels a csr.
  rpc CancelCsrWorkflow(CancelCsrWorkflowRequest) returns (CancelCsrWorkflowResponse);

  // Retrys a csr.
  rpc RetryCsrWorkflow(RetryCsrWorkflowRequest) returns (RetryCsrWorkflowResponse);

  // Pauses a csr.
  rpc PauseCsrWorkflow(PauseCsrWorkflowRequest) returns (PauseCsrWorkflowResponse);

  // Resumes a csr.
  rpc ResumeCsrWorkflow(ResumeCsrWorkflowRequest) returns (ResumeCsrWorkflowResponse);

  // Lists csrs a page at a time.
  rpc ListCsrWorkflows(ListCsrWorkflowsRequest) returns (ListCsrWorkflowsResponse);

  // Signals a csr.
  rpc SignalCsrWorkflow(SignalCsrWorkflowRequest) returns (SignalCsrWorkflowResponse);
}

// The request of `StartCsrWorkflow`.
message StartCsrWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string csr_id = 2;
  Csr csr = 3;
  StartCsrWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCsrWorkflow`.
message StartCsrWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Csr csr = 1;
  StartCsrWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

