syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CsrApprovalServiceProto";
option java_package = "com.acme.certificates.v1";

// Routes csrs through approval, with escalation and delegation.
service CsrApprovalService {
  // Submits a csr.
  rpc SubmitCsr(SubmitCsrRequest) returns (SubmitCsrResponse);

  // Approves a csr.
  rpc ApproveCsr(ApproveCsrRequest) returns (ApproveCsrResponse);

  // Rejects a csr.
  rpc RejectCsr(RejectCsrRequest) returns (RejectCsrResponse);

  // Escalates a csr.
  rpc EscalateCsr(EscalateCsrRequest) returns (EscalateCsrResponse);

  // Lists csrs a page at a time.
  rpc ListPendingCsrs(ListPendingCsrsRequest) returns (ListPendingCsrsResponse);

  // Delegates a csr.
  rpc DelegateCsrApproval(DelegateCsrApprovalRequest) returns (DelegateCsrApprovalResponse);

  // Recalls a csr.
  rpc RecallCsr(RecallCsrRequest) returns (RecallCsrResponse);

  // Returns a csr.
  rpc GetCsrApprovalStatus(GetCsrApprovalStatusRequest) returns (GetCsrApprovalStatusResponse);

  // Comments a csr.
  rpc CommentCsrApproval(CommentCsrApprovalRequest) returns (CommentCsrApprovalResponse);
}

// The request of `SubmitCsr`.
message SubmitCsrRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string csr_id = 2;
  Csr csr = 3;
  SubmitCsrRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCsr`.
message SubmitCsrResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Csr csr = 1;
  SubmitCsrResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

