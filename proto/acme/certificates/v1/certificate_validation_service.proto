syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateValidationServiceProto";
option java_package = "com.acme.certificates.v1";

// Checks certificates against the rules before anything acts on them.
service CertificateValidationService {
  // Validates a certificate.
  rpc ValidateCertificate(ValidateCertificateRequest) returns (ValidateCertificateResponse);

  // Previews a certificate.
  rpc PreviewCertificate(PreviewCertificateRequest) returns (PreviewCertificateResponse);

  // Checks a certificate.
  rpc CheckCertificateEligibility(CheckCertificateEligibilityRequest) returns (CheckCertificateEligibilityResponse);

  // Normalizes a certificate.
  rpc NormalizeCertificate(NormalizeCertificateRequest) returns (NormalizeCertificateResponse);

  // Explains a certificate.
  rpc ExplainCertificateDecision(ExplainCertificateDecisionRequest) returns (ExplainCertificateDecisionResponse);

  // Scores a certificate.
  rpc ScoreCertificate(ScoreCertificateRequest) returns (ScoreCertificateResponse);

  // Lints a certificate.
  rpc LintCertificates(LintCertificatesRequest) returns (LintCertificatesResponse);

  // Returns a certificate.
  rpc GetCertificateRules(GetCertificateRulesRequest) returns (GetCertificateRulesResponse);
}

// The request of `ValidateCertificate`.
message ValidateCertificateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_id = 2;
  Certificate certificate = 3;
  ValidateCertificateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCertificate`.
message ValidateCertificateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certificate certificate = 1;
  ValidateCertificateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

