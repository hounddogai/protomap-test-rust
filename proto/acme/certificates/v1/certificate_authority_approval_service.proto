syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateAuthorityApprovalServiceProto";
option java_package = "com.acme.certificates.v1";

// Routes certificate authorities through approval, with escalation and delegation.
service CertificateAuthorityApprovalService {
  // Submits a certificate authority.
  rpc SubmitCertificateAuthority(SubmitCertificateAuthorityRequest) returns (SubmitCertificateAuthorityResponse);

  // Approves a certificate authority.
  rpc ApproveCertificateAuthority(ApproveCertificateAuthorityRequest) returns (ApproveCertificateAuthorityResponse);

  // Rejects a certificate authority.
  rpc RejectCertificateAuthority(RejectCertificateAuthorityRequest) returns (RejectCertificateAuthorityResponse);

  // Escalates a certificate authority.
  rpc EscalateCertificateAuthority(EscalateCertificateAuthorityRequest) returns (EscalateCertificateAuthorityResponse);

  // Lists certificate authorities a page at a time.
  rpc ListPendingCertificateAuthorities(ListPendingCertificateAuthoritiesRequest) returns (ListPendingCertificateAuthoritiesResponse);

  // Delegates a certificate authority.
  rpc DelegateCertificateAuthorityApproval(DelegateCertificateAuthorityApprovalRequest) returns (DelegateCertificateAuthorityApprovalResponse);

  // Recalls a certificate authority.
  rpc RecallCertificateAuthority(RecallCertificateAuthorityRequest) returns (RecallCertificateAuthorityResponse);
}

// The request of `SubmitCertificateAuthority`.
message SubmitCertificateAuthorityRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_authority_id = 2;
  CertificateAuthority certificate_authority = 3;
  SubmitCertificateAuthorityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCertificateAuthority`.
message SubmitCertificateAuthorityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CertificateAuthority certificate_authority = 1;
  SubmitCertificateAuthorityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

