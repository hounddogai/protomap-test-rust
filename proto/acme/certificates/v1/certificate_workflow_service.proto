syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateWorkflowServiceProto";
option java_package = "com.acme.certificates.v1";

// Runs the long-lived workflow that takes a certificate from start to finish.
service CertificateWorkflowService {
  // Starts a certificate.
  rpc StartCertificateWorkflow(StartCertificateWorkflowRequest) returns (StartCertificateWorkflowResponse);

  // Advances a certificate.
  rpc AdvanceCertificateWorkflow(AdvanceCertificateWorkflowRequest) returns (AdvanceCertificateWorkflowResponse);

  // Retrys a certificate.
  rpc RetryCertificateWorkflow(RetryCertificateWorkflowRequest) returns (RetryCertificateWorkflowResponse);

  // Pauses a certificate.
  rpc PauseCertificateWorkflow(PauseCertificateWorkflowRequest) returns (PauseCertificateWorkflowResponse);

  // Resumes a certificate.
  rpc ResumeCertificateWorkflow(ResumeCertificateWorkflowRequest) returns (ResumeCertificateWorkflowResponse);

  // Returns a certificate.
  rpc InspectCertificateWorkflow(InspectCertificateWorkflowRequest) returns (InspectCertificateWorkflowResponse);

  // Lists certificates a page at a time.
  rpc ListCertificateWorkflows(ListCertificateWorkflowsRequest) returns (ListCertificateWorkflowsResponse);

  // Signals a certificate.
  rpc SignalCertificateWorkflow(SignalCertificateWorkflowRequest) returns (SignalCertificateWorkflowResponse);
}

// The request of `StartCertificateWorkflow`.
message StartCertificateWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_id = 2;
  Certificate certificate = 3;
  StartCertificateWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCertificateWorkflow`.
message StartCertificateWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certificate certificate = 1;
  StartCertificateWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

