syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CsrCalculationServiceProto";
option java_package = "com.acme.certificates.v1";

// Computes the figures of a csr, such as totals, taxes, and estimates.
service CsrCalculationService {
  // Calculates a csr.
  rpc CalculateCsr(CalculateCsrRequest) returns (CalculateCsrResponse);

  // Estimates a csr.
  rpc EstimateCsr(EstimateCsrRequest) returns (EstimateCsrResponse);

  // Quotes a csr.
  rpc QuoteCsr(QuoteCsrRequest) returns (QuoteCsrResponse);

  // Compares a csr.
  rpc CompareCsrOptions(CompareCsrOptionsRequest) returns (CompareCsrOptionsResponse);

  // Recalculates a csr.
  rpc RecalculateCsrs(RecalculateCsrsRequest) returns (RecalculateCsrsResponse);

  // Simulates a csr.
  rpc SimulateCsr(SimulateCsrRequest) returns (SimulateCsrResponse);

  // Explains a csr.
  rpc ExplainCsrCalculation(ExplainCsrCalculationRequest) returns (ExplainCsrCalculationResponse);

  // Returns a csr.
  rpc GetCsrRates(GetCsrRatesRequest) returns (GetCsrRatesResponse);
}

// The request of `CalculateCsr`.
message CalculateCsrRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string csr_id = 2;
  Csr csr = 3;
  CalculateCsrRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCsr`.
message CalculateCsrResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCsrResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Csr csr = 1;
  CalculateCsrResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

