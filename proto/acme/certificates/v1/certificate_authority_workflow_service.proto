syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateAuthorityWorkflowServiceProto";
option java_package = "com.acme.certificates.v1";

// Runs the long-lived workflow that takes a certificate authority from start to finish.
service CertificateAuthorityWorkflowService {
  // Starts a certificate authority.
  rpc StartCertificateAuthorityWorkflow(StartCertificateAuthorityWorkflowRequest) returns (StartCertificateAuthorityWorkflowResponse);

  // Advances a certificate authority.
  rpc AdvanceCertificateAuthorityWorkflow(AdvanceCertificateAuthorityWorkflowRequest) returns (AdvanceCertificateAuthorityWorkflowResponse);

  // Cancels a certificate authority.
  rpc CancelCertificateAuthorityWorkflow(CancelCertificateAuthorityWorkflowRequest) returns (CancelCertificateAuthorityWorkflowResponse);

  // Retrys a certificate authority.
  rpc RetryCertificateAuthorityWorkflow(RetryCertificateAuthorityWorkflowRequest) returns (RetryCertificateAuthorityWorkflowResponse);

  // Pauses a certificate authority.
  rpc PauseCertificateAuthorityWorkflow(PauseCertificateAuthorityWorkflowRequest) returns (PauseCertificateAuthorityWorkflowResponse);

  // Resumes a certificate authority.
  rpc ResumeCertificateAuthorityWorkflow(ResumeCertificateAuthorityWorkflowRequest) returns (ResumeCertificateAuthorityWorkflowResponse);

  // Returns a certificate authority.
  rpc InspectCertificateAuthorityWorkflow(InspectCertificateAuthorityWorkflowRequest) returns (InspectCertificateAuthorityWorkflowResponse);

  // Lists certificate authorities a page at a time.
  rpc ListCertificateAuthorityWorkflows(ListCertificateAuthorityWorkflowsRequest) returns (ListCertificateAuthorityWorkflowsResponse);

  // Signals a certificate authority.
  rpc SignalCertificateAuthorityWorkflow(SignalCertificateAuthorityWorkflowRequest) returns (SignalCertificateAuthorityWorkflowResponse);
}

// The request of `StartCertificateAuthorityWorkflow`.
message StartCertificateAuthorityWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_authority_id = 2;
  CertificateAuthority certificate_authority = 3;
  StartCertificateAuthorityWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCertificateAuthorityWorkflow`.
message StartCertificateAuthorityWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CertificateAuthority certificate_authority = 1;
  StartCertificateAuthorityWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

