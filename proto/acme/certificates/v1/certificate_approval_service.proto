syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateApprovalServiceProto";
option java_package = "com.acme.certificates.v1";

// Routes certificates through approval, with escalation and delegation.
service CertificateApprovalService {
  // Submits a certificate.
  rpc SubmitCertificate(SubmitCertificateRequest) returns (SubmitCertificateResponse);

  // Approves a certificate.
  rpc ApproveCertificate(ApproveCertificateRequest) returns (ApproveCertificateResponse);

  // Rejects a certificate.
  rpc RejectCertificate(RejectCertificateRequest) returns (RejectCertificateResponse);

  // Escalates a certificate.
  rpc EscalateCertificate(EscalateCertificateRequest) returns (EscalateCertificateResponse);

  // Lists certificates a page at a time.
  rpc ListPendingCertificates(ListPendingCertificatesRequest) returns (ListPendingCertificatesResponse);

  // Delegates a certificate.
  rpc DelegateCertificateApproval(DelegateCertificateApprovalRequest) returns (DelegateCertificateApprovalResponse);

  // Recalls a certificate.
  rpc RecallCertificate(RecallCertificateRequest) returns (RecallCertificateResponse);

  // Returns a certificate.
  rpc GetCertificateApprovalStatus(GetCertificateApprovalStatusRequest) returns (GetCertificateApprovalStatusResponse);
}

// The request of `SubmitCertificate`.
message SubmitCertificateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_id = 2;
  Certificate certificate = 3;
  SubmitCertificateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCertificate`.
message SubmitCertificateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certificate certificate = 1;
  SubmitCertificateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

