syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateAuthorityQueryServiceProto";
option java_package = "com.acme.certificates.v1";

// Answers read-only questions about certificate authorities, for screens and reports.
service CertificateAuthorityQueryService {
  // Returns a certificate authority.
  rpc LookupCertificateAuthority(LookupCertificateAuthorityRequest) returns (LookupCertificateAuthorityResponse);

  // Lists certificate authorities a page at a time.
  rpc BrowseCertificateAuthorities(BrowseCertificateAuthoritiesRequest) returns (BrowseCertificateAuthoritiesResponse);

  // Lists certificate authorities a page at a time.
  rpc FindCertificateAuthorities(FindCertificateAuthoritiesRequest) returns (FindCertificateAuthoritiesResponse);

  // Counts certificate authorities by status.
  rpc CountCertificateAuthorities(CountCertificateAuthoritiesRequest) returns (CountCertificateAuthoritiesResponse);

  // Returns several certificate authorities at once.
  rpc ResolveCertificateAuthorities(ResolveCertificateAuthoritiesRequest) returns (ResolveCertificateAuthoritiesResponse);

  // Streams every matching certificate authority.
  rpc ExportCertificateAuthorities(ExportCertificateAuthoritiesRequest) returns (stream ExportCertificateAuthoritiesResponse);

  // Summarizes a certificate authority.
  rpc SummarizeCertificateAuthorities(SummarizeCertificateAuthoritiesRequest) returns (SummarizeCertificateAuthoritiesResponse);

  // Lists certificate authorities a page at a time.
  rpc SuggestCertificateAuthorities(SuggestCertificateAuthoritiesRequest) returns (SuggestCertificateAuthoritiesResponse);

  // Returns a certificate authority.
  rpc PeekCertificateAuthority(PeekCertificateAuthorityRequest) returns (PeekCertificateAuthorityResponse);
}

// The request of `LookupCertificateAuthority`.
message LookupCertificateAuthorityRequest {
  acme.common.v1.RequestContext context = 1;
  string certificate_authority_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCertificateAuthority`.
message LookupCertificateAuthorityResponse {
  CertificateAuthority certificate_authority = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCertificateAuthorities`.
message BrowseCertificateAuthoritiesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CertificateAuthorityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCertificateAuthoritiesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCertificateAuthorities`.
message BrowseCertificateAuthoritiesResponse {
  repeated CertificateAuthority certificate_authorities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindCertificateAuthorities`.
message FindCertificateAuthoritiesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CertificateAuthorityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindCertificateAuthoritiesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindCertificateAuthorities`.
message FindCertificateAuthoritiesResponse {
  repeated CertificateAuthority certificate_authorities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCertificateAuthorities`.
message CountCertificateAuthoritiesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CertificateAuthorityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCertificateAuthoritiesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCertificateAuthorities`.
message CountCertificateAuthoritiesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCertificateAuthorities`.
message ResolveCertificateAuthoritiesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string certificate_authority_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCertificateAuthorities`.
message ResolveCertificateAuthoritiesResponse {
  repeated CertificateAuthority certificate_authorities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportCertificateAuthorities`.
message ExportCertificateAuthoritiesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CertificateAuthorityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportCertificateAuthoritiesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportCertificateAuthorities`.
message ExportCertificateAuthoritiesResponse {
  CertificateAuthority certificate_authority = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeCertificateAuthorities`.
message SummarizeCertificateAuthoritiesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_authority_id = 2;
  SummarizeCertificateAuthoritiesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCertificateAuthorities`.
message SummarizeCertificateAuthoritiesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCertificateAuthorities`.
message SuggestCertificateAuthoritiesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CertificateAuthorityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCertificateAuthoritiesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCertificateAuthorities`.
message SuggestCertificateAuthoritiesResponse {
  repeated CertificateAuthority certificate_authorities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCertificateAuthority`.
message PeekCertificateAuthorityRequest {
  acme.common.v1.RequestContext context = 1;
  string certificate_authority_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCertificateAuthority`.
message PeekCertificateAuthorityResponse {
  CertificateAuthority certificate_authority = 1;
  acme.common.v1.OperationResult result = 2;
}
