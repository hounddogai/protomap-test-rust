// The request of `GetCsrRules`.
message GetCsrRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string csr_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCsrRules`.
message GetCsrRulesResponse {
  Csr csr = 1;
  acme.common.v1.OperationResult result = 2;
}
