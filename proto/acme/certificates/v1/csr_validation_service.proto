syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CsrValidationServiceProto";
option java_package = "com.acme.certificates.v1";

// Checks csrs against the rules before anything acts on them.
service CsrValidationService {
  // Validates a csr.
  rpc ValidateCsr(ValidateCsrRequest) returns (ValidateCsrResponse);

  // Previews a csr.
  rpc PreviewCsr(PreviewCsrRequest) returns (PreviewCsrResponse);

  // Normalizes a csr.
  rpc NormalizeCsr(NormalizeCsrRequest) returns (NormalizeCsrResponse);

  // Explains a csr.
  rpc ExplainCsrDecision(ExplainCsrDecisionRequest) returns (ExplainCsrDecisionResponse);

  // Scores a csr.
  rpc ScoreCsr(ScoreCsrRequest) returns (ScoreCsrResponse);

  // Lints a csr.
  rpc LintCsrs(LintCsrsRequest) returns (LintCsrsResponse);

  // Returns a csr.
  rpc GetCsrRules(GetCsrRulesRequest) returns (GetCsrRulesResponse);
}

// The request of `ValidateCsr`.
message ValidateCsrRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string csr_id = 2;
  Csr csr = 3;
  ValidateCsrRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCsr`.
message ValidateCsrResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Csr csr = 1;
  ValidateCsrResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

