syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationApprovalServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Routes key rotations through approval, with escalation and delegation.
service KeyRotationApprovalService {
  // Submits a key rotation.
  rpc SubmitKeyRotation(SubmitKeyRotationRequest) returns (SubmitKeyRotationResponse);

  // Approves a key rotation.
  rpc ApproveKeyRotation(ApproveKeyRotationRequest) returns (ApproveKeyRotationResponse);

  // Rejects a key rotation.
  rpc RejectKeyRotation(RejectKeyRotationRequest) returns (RejectKeyRotationResponse);

  // Escalates a key rotation.
  rpc EscalateKeyRotation(EscalateKeyRotationRequest) returns (EscalateKeyRotationResponse);

  // Lists key rotations a page at a time.
  rpc ListPendingKeyRotations(ListPendingKeyRotationsRequest) returns (ListPendingKeyRotationsResponse);

  // Delegates a key rotation.
  rpc DelegateKeyRotationApproval(DelegateKeyRotationApprovalRequest) returns (DelegateKeyRotationApprovalResponse);

  // Recalls a key rotation.
  rpc RecallKeyRotation(RecallKeyRotationRequest) returns (RecallKeyRotationResponse);

  // Returns a key rotation.
  rpc GetKeyRotationApprovalStatus(GetKeyRotationApprovalStatusRequest) returns (GetKeyRotationApprovalStatusResponse);

  // Comments a key rotation.
  rpc CommentKeyRotationApproval(CommentKeyRotationApprovalRequest) returns (CommentKeyRotationApprovalResponse);
}

// The request of `SubmitKeyRotation`.
message SubmitKeyRotationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  KeyRotation key_rotation = 3;
  SubmitKeyRotationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitKeyRotation`.
message SubmitKeyRotationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRotation key_rotation = 1;
  SubmitKeyRotationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

