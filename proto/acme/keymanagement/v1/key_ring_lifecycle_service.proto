syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRingLifecycleServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Moves a key ring between the states of its lifecycle.
service KeyRingLifecycleService {
  // Activates a key ring.
  rpc ActivateKeyRing(ActivateKeyRingRequest) returns (ActivateKeyRingResponse);

  // Suspends a key ring.
  rpc SuspendKeyRing(SuspendKeyRingRequest) returns (SuspendKeyRingResponse);

  // Reinstates a key ring.
  rpc ReinstateKeyRing(ReinstateKeyRingRequest) returns (ReinstateKeyRingResponse);

  // Terminates a key ring.
  rpc TerminateKeyRing(TerminateKeyRingRequest) returns (TerminateKeyRingResponse);

  // Renews a key ring.
  rpc RenewKeyRing(RenewKeyRingRequest) returns (RenewKeyRingResponse);

  // Expires a key ring.
  rpc ExpireKeyRing(ExpireKeyRingRequest) returns (ExpireKeyRingResponse);

  // Returns a key ring.
  rpc GetKeyRingLifecycle(GetKeyRingLifecycleRequest) returns (GetKeyRingLifecycleResponse);

  // Schedules a key ring.
  rpc ScheduleKeyRingExpiry(ScheduleKeyRingExpiryRequest) returns (ScheduleKeyRingExpiryResponse);
}

// The request of `ActivateKeyRing`.
message ActivateKeyRingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  ActivateKeyRingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateKeyRing`.
message ActivateKeyRingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRing key_ring = 1;
  ActivateKeyRingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

