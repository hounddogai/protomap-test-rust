syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "CryptoKeyLifecycleServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Moves a crypto key between the states of its lifecycle.
service CryptoKeyLifecycleService {
  // Activates a crypto key.
  rpc ActivateCryptoKey(ActivateCryptoKeyRequest) returns (ActivateCryptoKeyResponse);

  // Suspends a crypto key.
  rpc SuspendCryptoKey(SuspendCryptoKeyRequest) returns (SuspendCryptoKeyResponse);

  // Reinstates a crypto key.
  rpc ReinstateCryptoKey(ReinstateCryptoKeyRequest) returns (ReinstateCryptoKeyResponse);

  // Renews a crypto key.
  rpc RenewCryptoKey(RenewCryptoKeyRequest) returns (RenewCryptoKeyResponse);

  // Expires a crypto key.
  rpc ExpireCryptoKey(ExpireCryptoKeyRequest) returns (ExpireCryptoKeyResponse);

  // Returns a crypto key.
  rpc GetCryptoKeyLifecycle(GetCryptoKeyLifecycleRequest) returns (GetCryptoKeyLifecycleResponse);

  // Schedules a crypto key.
  rpc ScheduleCryptoKeyExpiry(ScheduleCryptoKeyExpiryRequest) returns (ScheduleCryptoKeyExpiryResponse);
}

// The request of `ActivateCryptoKey`.
message ActivateCryptoKeyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  ActivateCryptoKeyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCryptoKey`.
message ActivateCryptoKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CryptoKey crypto_key = 1;
  ActivateCryptoKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

