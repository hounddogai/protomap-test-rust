syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "CryptoKeyValidationServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Checks crypto keys against the rules before anything acts on them.
service CryptoKeyValidationService {
  // Validates a crypto key.
  rpc ValidateCryptoKey(ValidateCryptoKeyRequest) returns (ValidateCryptoKeyResponse);

  // Previews a crypto key.
  rpc PreviewCryptoKey(PreviewCryptoKeyRequest) returns (PreviewCryptoKeyResponse);

  // Explains a crypto key.
  rpc ExplainCryptoKeyDecision(ExplainCryptoKeyDecisionRequest) returns (ExplainCryptoKeyDecisionResponse);

  // Scores a crypto key.
  rpc ScoreCryptoKey(ScoreCryptoKeyRequest) returns (ScoreCryptoKeyResponse);

  // Lints a crypto key.
  rpc LintCryptoKeys(LintCryptoKeysRequest) returns (LintCryptoKeysResponse);

  // Returns a crypto key.
  rpc GetCryptoKeyRules(GetCryptoKeyRulesRequest) returns (GetCryptoKeyRulesResponse);
}

// The request of `ValidateCryptoKey`.
message ValidateCryptoKeyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  CryptoKey crypto_key = 3;
  ValidateCryptoKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCryptoKey`.
message ValidateCryptoKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CryptoKey crypto_key = 1;
  ValidateCryptoKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewCryptoKey`.
message PreviewCryptoKeyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  CryptoKey crypto_key = 3;
  PreviewCryptoKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewCryptoKey`.
message PreviewCryptoKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CryptoKey crypto_key = 1;
  PreviewCryptoKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

