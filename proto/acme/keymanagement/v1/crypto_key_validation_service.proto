// The request of `GetCryptoKeyRules`.
message GetCryptoKeyRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCryptoKeyRules`.
message GetCryptoKeyRulesResponse {
  CryptoKey crypto_key = 1;
  acme.common.v1.OperationResult result = 2;
}
