option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationLifecycleServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Moves a key rotation between the states of its lifecycle.
service KeyRotationLifecycleService {
  // Activates a key rotation.
  rpc ActivateKeyRotation(ActivateKeyRotationRequest) returns (ActivateKeyRotationResponse);

  // Suspends a key rotation.
  rpc SuspendKeyRotation(SuspendKeyRotationRequest) returns (SuspendKeyRotationResponse);

  // Reinstates a key rotation.
  rpc ReinstateKeyRotation(ReinstateKeyRotationRequest) returns (ReinstateKeyRotationResponse);

  // Terminates a key rotation.
  rpc TerminateKeyRotation(TerminateKeyRotationRequest) returns (TerminateKeyRotationResponse);

  // Renews a key rotation.
  rpc RenewKeyRotation(RenewKeyRotationRequest) returns (RenewKeyRotationResponse);

  // Expires a key rotation.
  rpc ExpireKeyRotation(ExpireKeyRotationRequest) returns (ExpireKeyRotationResponse);

  // Returns a key rotation.
  rpc GetKeyRotationLifecycle(GetKeyRotationLifecycleRequest) returns (GetKeyRotationLifecycleResponse);

  // Schedules a key rotation.
  rpc ScheduleKeyRotationExpiry(ScheduleKeyRotationExpiryRequest) returns (ScheduleKeyRotationExpiryResponse);
}

// The request of `ActivateKeyRotation`.
message ActivateKeyRotationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  ActivateKeyRotationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateKeyRotation`.
message ActivateKeyRotationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRotation key_rotation = 1;
  ActivateKeyRotationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

