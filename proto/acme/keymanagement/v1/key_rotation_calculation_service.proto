syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationCalculationServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Computes the figures of a key rotation, such as totals, taxes, and estimates.
service KeyRotationCalculationService {
  // Calculates a key rotation.
  rpc CalculateKeyRotation(CalculateKeyRotationRequest) returns (CalculateKeyRotationResponse);

  // Estimates a key rotation.
  rpc EstimateKeyRotation(EstimateKeyRotationRequest) returns (EstimateKeyRotationResponse);

  // Recalculates a key rotation.
  rpc RecalculateKeyRotations(RecalculateKeyRotationsRequest) returns (RecalculateKeyRotationsResponse);

  // Simulates a key rotation.
  rpc SimulateKeyRotation(SimulateKeyRotationRequest) returns (SimulateKeyRotationResponse);

  // Explains a key rotation.
  rpc ExplainKeyRotationCalculation(ExplainKeyRotationCalculationRequest) returns (ExplainKeyRotationCalculationResponse);

  // Returns a key rotation.
  rpc GetKeyRotationRates(GetKeyRotationRatesRequest) returns (GetKeyRotationRatesResponse);
}

// The request of `CalculateKeyRotation`.
message CalculateKeyRotationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  KeyRotation key_rotation = 3;
  CalculateKeyRotationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateKeyRotation`.
message CalculateKeyRotationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateKeyRotationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  KeyRotation key_rotation = 1;
  CalculateKeyRotationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

