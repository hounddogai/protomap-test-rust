syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRingReportingServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Builds and schedules reports about key rings.
service KeyRingReportingService {
  // Generates a key ring.
  rpc GenerateKeyRingReport(GenerateKeyRingReportRequest) returns (GenerateKeyRingReportResponse);

  // Returns a key ring.
  rpc FetchKeyRingReport(FetchKeyRingReportRequest) returns (FetchKeyRingReportResponse);

  // Schedules a key ring.
  rpc ScheduleKeyRingReport(ScheduleKeyRingReportRequest) returns (ScheduleKeyRingReportResponse);

  // Streams the changes of key rings as they happen.
  rpc StreamKeyRingMetrics(StreamKeyRingMetricsRequest) returns (stream StreamKeyRingMetricsResponse);

  // Lists key rings a page at a time.
  rpc ListKeyRingReports(ListKeyRingReportsRequest) returns (ListKeyRingReportsResponse);

  // Shares a key ring.
  rpc ShareKeyRingReport(ShareKeyRingReportRequest) returns (ShareKeyRingReportResponse);

  // Counts key rings by status.
  rpc CountKeyRingTotals(CountKeyRingTotalsRequest) returns (CountKeyRingTotalsResponse);
}

// The request of `GenerateKeyRingReport`.
message GenerateKeyRingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  GenerateKeyRingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateKeyRingReport`.
message GenerateKeyRingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchKeyRingReport`.
message FetchKeyRingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchKeyRingReport`.
message FetchKeyRingReportResponse {
  KeyRing key_ring = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleKeyRingReport`.
message ScheduleKeyRingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  ScheduleKeyRingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleKeyRingReport`.
message ScheduleKeyRingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamKeyRingMetrics`.
message StreamKeyRingMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KeyRingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamKeyRingMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamKeyRingMetrics`.
message StreamKeyRingMetricsResponse {
  KeyRing key_ring = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListKeyRingReports`.
message ListKeyRingReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KeyRingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListKeyRingReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListKeyRingReports`.
message ListKeyRingReportsResponse {
  repeated KeyRing key_rings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareKeyRingReport`.
message ShareKeyRingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  ShareKeyRingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareKeyRingReport`.
message ShareKeyRingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRing key_ring = 1;
  ShareKeyRingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountKeyRingTotals`.
message CountKeyRingTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KeyRingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountKeyRingTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountKeyRingTotals`.
message CountKeyRingTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
