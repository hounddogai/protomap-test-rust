// The request of `GetKeyRingApprovalStatus`.
message GetKeyRingApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetKeyRingApprovalStatus`.
message GetKeyRingApprovalStatusResponse {
  KeyRing key_ring = 1;
  acme.common.v1.OperationResult result = 2;
}
