syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRingApprovalServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Routes key rings through approval, with escalation and delegation.
service KeyRingApprovalService {
  // Submits a key ring.
  rpc SubmitKeyRing(SubmitKeyRingRequest) returns (SubmitKeyRingResponse);

  // Approves a key ring.
  rpc ApproveKeyRing(ApproveKeyRingRequest) returns (ApproveKeyRingResponse);

  // Rejects a key ring.
  rpc RejectKeyRing(RejectKeyRingRequest) returns (RejectKeyRingResponse);

  // Escalates a key ring.
  rpc EscalateKeyRing(EscalateKeyRingRequest) returns (EscalateKeyRingResponse);

  // Lists key rings a page at a time.
  rpc ListPendingKeyRings(ListPendingKeyRingsRequest) returns (ListPendingKeyRingsResponse);

  // Recalls a key ring.
  rpc RecallKeyRing(RecallKeyRingRequest) returns (RecallKeyRingResponse);

  // Returns a key ring.
  rpc GetKeyRingApprovalStatus(GetKeyRingApprovalStatusRequest) returns (GetKeyRingApprovalStatusResponse);
}

// The request of `SubmitKeyRing`.
message SubmitKeyRingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  KeyRing key_ring = 3;
  SubmitKeyRingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitKeyRing`.
message SubmitKeyRingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRing key_ring = 1;
  SubmitKeyRingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveKeyRing`.
message ApproveKeyRingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
