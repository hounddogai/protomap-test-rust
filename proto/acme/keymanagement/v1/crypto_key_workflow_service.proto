option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "CryptoKeyWorkflowServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Runs the long-lived workflow that takes a crypto key from start to finish.
service CryptoKeyWorkflowService {
  // Starts a crypto key.
  rpc StartCryptoKeyWorkflow(StartCryptoKeyWorkflowRequest) returns (StartCryptoKeyWorkflowResponse);

  // Advances a crypto key.
  rpc AdvanceCryptoKeyWorkflow(AdvanceCryptoKeyWorkflowRequest) returns (AdvanceCryptoKeyWorkflowResponse);

  // Cancels a crypto key.
  rpc CancelCryptoKeyWorkflow(CancelCryptoKeyWorkflowRequest) returns (CancelCryptoKeyWorkflowResponse);

  // Retrys a crypto key.
  rpc RetryCryptoKeyWorkflow(RetryCryptoKeyWorkflowRequest) returns (RetryCryptoKeyWorkflowResponse);

  // Pauses a crypto key.
  rpc PauseCryptoKeyWorkflow(PauseCryptoKeyWorkflowRequest) returns (PauseCryptoKeyWorkflowResponse);

  // Resumes a crypto key.
  rpc ResumeCryptoKeyWorkflow(ResumeCryptoKeyWorkflowRequest) returns (ResumeCryptoKeyWorkflowResponse);

  // Returns a crypto key.
  rpc InspectCryptoKeyWorkflow(InspectCryptoKeyWorkflowRequest) returns (InspectCryptoKeyWorkflowResponse);

  // Lists crypto keys a page at a time.
  rpc ListCryptoKeyWorkflows(ListCryptoKeyWorkflowsRequest) returns (ListCryptoKeyWorkflowsResponse);

  // Signals a crypto key.
  rpc SignalCryptoKeyWorkflow(SignalCryptoKeyWorkflowRequest) returns (SignalCryptoKeyWorkflowResponse);
}

// The request of `StartCryptoKeyWorkflow`.
message StartCryptoKeyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  CryptoKey crypto_key = 3;
  StartCryptoKeyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCryptoKeyWorkflow`.
message StartCryptoKeyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CryptoKey crypto_key = 1;
  StartCryptoKeyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

