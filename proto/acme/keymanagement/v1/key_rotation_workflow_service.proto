option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationWorkflowServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Runs the long-lived workflow that takes a key rotation from start to finish.
service KeyRotationWorkflowService {
  // Starts a key rotation.
  rpc StartKeyRotationWorkflow(StartKeyRotationWorkflowRequest) returns (StartKeyRotationWorkflowResponse);

  // Advances a key rotation.
  rpc AdvanceKeyRotationWorkflow(AdvanceKeyRotationWorkflowRequest) returns (AdvanceKeyRotationWorkflowResponse);

  // Cancels a key rotation.
  rpc CancelKeyRotationWorkflow(CancelKeyRotationWorkflowRequest) returns (CancelKeyRotationWorkflowResponse);

  // Retrys a key rotation.
  rpc RetryKeyRotationWorkflow(RetryKeyRotationWorkflowRequest) returns (RetryKeyRotationWorkflowResponse);

  // Pauses a key rotation.
  rpc PauseKeyRotationWorkflow(PauseKeyRotationWorkflowRequest) returns (PauseKeyRotationWorkflowResponse);

  // Resumes a key rotation.
  rpc ResumeKeyRotationWorkflow(ResumeKeyRotationWorkflowRequest) returns (ResumeKeyRotationWorkflowResponse);

  // Returns a key rotation.
  rpc InspectKeyRotationWorkflow(InspectKeyRotationWorkflowRequest) returns (InspectKeyRotationWorkflowResponse);

  // Lists key rotations a page at a time.
  rpc ListKeyRotationWorkflows(ListKeyRotationWorkflowsRequest) returns (ListKeyRotationWorkflowsResponse);

  // Signals a key rotation.
  rpc SignalKeyRotationWorkflow(SignalKeyRotationWorkflowRequest) returns (SignalKeyRotationWorkflowResponse);
}

// The request of `StartKeyRotationWorkflow`.
message StartKeyRotationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  KeyRotation key_rotation = 3;
  StartKeyRotationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartKeyRotationWorkflow`.
message StartKeyRotationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRotation key_rotation = 1;
  StartKeyRotationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

