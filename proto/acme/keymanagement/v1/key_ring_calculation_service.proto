syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRingCalculationServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Computes the figures of a key ring, such as totals, taxes, and estimates.
service KeyRingCalculationService {
  // Calculates a key ring.
  rpc CalculateKeyRing(CalculateKeyRingRequest) returns (CalculateKeyRingResponse);

  // Estimates a key ring.
  rpc EstimateKeyRing(EstimateKeyRingRequest) returns (EstimateKeyRingResponse);

  // Quotes a key ring.
  rpc QuoteKeyRing(QuoteKeyRingRequest) returns (QuoteKeyRingResponse);

  // Compares a key ring.
  rpc CompareKeyRingOptions(CompareKeyRingOptionsRequest) returns (CompareKeyRingOptionsResponse);

  // Recalculates a key ring.
  rpc RecalculateKeyRings(RecalculateKeyRingsRequest) returns (RecalculateKeyRingsResponse);

  // Simulates a key ring.
  rpc SimulateKeyRing(SimulateKeyRingRequest) returns (SimulateKeyRingResponse);

  // Explains a key ring.
  rpc ExplainKeyRingCalculation(ExplainKeyRingCalculationRequest) returns (ExplainKeyRingCalculationResponse);

  // Returns a key ring.
  rpc GetKeyRingRates(GetKeyRingRatesRequest) returns (GetKeyRingRatesResponse);
}

// The request of `CalculateKeyRing`.
message CalculateKeyRingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_ring_id = 2;
  KeyRing key_ring = 3;
  CalculateKeyRingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateKeyRing`.
message CalculateKeyRingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateKeyRingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  KeyRing key_ring = 1;
  CalculateKeyRingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

