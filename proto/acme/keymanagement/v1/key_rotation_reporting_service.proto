syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationReportingServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Builds and schedules reports about key rotations.
service KeyRotationReportingService {
  // Generates a key rotation.
  rpc GenerateKeyRotationReport(GenerateKeyRotationReportRequest) returns (GenerateKeyRotationReportResponse);

  // Returns a key rotation.
  rpc FetchKeyRotationReport(FetchKeyRotationReportRequest) returns (FetchKeyRotationReportResponse);

  // Schedules a key rotation.
  rpc ScheduleKeyRotationReport(ScheduleKeyRotationReportRequest) returns (ScheduleKeyRotationReportResponse);

  // Streams the changes of key rotations as they happen.
  rpc StreamKeyRotationMetrics(StreamKeyRotationMetricsRequest) returns (stream StreamKeyRotationMetricsResponse);

  // Lists key rotations a page at a time.
  rpc ListKeyRotationReports(ListKeyRotationReportsRequest) returns (ListKeyRotationReportsResponse);

  // Shares a key rotation.
  rpc ShareKeyRotationReport(ShareKeyRotationReportRequest) returns (ShareKeyRotationReportResponse);
}

// The request of `GenerateKeyRotationReport`.
message GenerateKeyRotationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  GenerateKeyRotationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateKeyRotationReport`.
message GenerateKeyRotationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchKeyRotationReport`.
message FetchKeyRotationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchKeyRotationReport`.
message FetchKeyRotationReportResponse {
  KeyRotation key_rotation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleKeyRotationReport`.
message ScheduleKeyRotationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  ScheduleKeyRotationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleKeyRotationReport`.
message ScheduleKeyRotationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamKeyRotationMetrics`.
message StreamKeyRotationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KeyRotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamKeyRotationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamKeyRotationMetrics`.
message StreamKeyRotationMetricsResponse {
  KeyRotation key_rotation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListKeyRotationReports`.
message ListKeyRotationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KeyRotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListKeyRotationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListKeyRotationReports`.
message ListKeyRotationReportsResponse {
  repeated KeyRotation key_rotations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareKeyRotationReport`.
message ShareKeyRotationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  ShareKeyRotationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareKeyRotationReport`.
message ShareKeyRotationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRotation key_rotation = 1;
  ShareKeyRotationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
