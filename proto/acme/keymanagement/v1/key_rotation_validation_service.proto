syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "KeyRotationValidationServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Checks key rotations against the rules before anything acts on them.
service KeyRotationValidationService {
  // Validates a key rotation.
  rpc ValidateKeyRotation(ValidateKeyRotationRequest) returns (ValidateKeyRotationResponse);

  // Previews a key rotation.
  rpc PreviewKeyRotation(PreviewKeyRotationRequest) returns (PreviewKeyRotationResponse);

  // Checks a key rotation.
  rpc CheckKeyRotationEligibility(CheckKeyRotationEligibilityRequest) returns (CheckKeyRotationEligibilityResponse);

  // Normalizes a key rotation.
  rpc NormalizeKeyRotation(NormalizeKeyRotationRequest) returns (NormalizeKeyRotationResponse);

  // Explains a key rotation.
  rpc ExplainKeyRotationDecision(ExplainKeyRotationDecisionRequest) returns (ExplainKeyRotationDecisionResponse);

  // Scores a key rotation.
  rpc ScoreKeyRotation(ScoreKeyRotationRequest) returns (ScoreKeyRotationResponse);

  // Lints a key rotation.
  rpc LintKeyRotations(LintKeyRotationsRequest) returns (LintKeyRotationsResponse);

  // Returns a key rotation.
  rpc GetKeyRotationRules(GetKeyRotationRulesRequest) returns (GetKeyRotationRulesResponse);
}

// The request of `ValidateKeyRotation`.
message ValidateKeyRotationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string key_rotation_id = 2;
  KeyRotation key_rotation = 3;
  ValidateKeyRotationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateKeyRotation`.
message ValidateKeyRotationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KeyRotation key_rotation = 1;
  ValidateKeyRotationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

