syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "ThrottleValidationServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Checks throttles against the rules before anything acts on them.
service ThrottleValidationService {
  // Validates a throttle.
  rpc ValidateThrottle(ValidateThrottleRequest) returns (ValidateThrottleResponse);

  // Previews a throttle.
  rpc PreviewThrottle(PreviewThrottleRequest) returns (PreviewThrottleResponse);

  // Checks a throttle.
  rpc CheckThrottleEligibility(CheckThrottleEligibilityRequest) returns (CheckThrottleEligibilityResponse);

  // Explains a throttle.
  rpc ExplainThrottleDecision(ExplainThrottleDecisionRequest) returns (ExplainThrottleDecisionResponse);

  // Scores a throttle.
  rpc ScoreThrottle(ScoreThrottleRequest) returns (ScoreThrottleResponse);

  // Lints a throttle.
  rpc LintThrottles(LintThrottlesRequest) returns (LintThrottlesResponse);

  // Returns a throttle.
  rpc GetThrottleRules(GetThrottleRulesRequest) returns (GetThrottleRulesResponse);
}

// The request of `ValidateThrottle`.
message ValidateThrottleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  Throttle throttle = 3;
  ValidateThrottleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateThrottle`.
message ValidateThrottleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Throttle throttle = 1;
  ValidateThrottleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

