syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "ThrottleSyncServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Keeps throttles in step with the systems of record in other regions.
service ThrottleSyncService {
  // Syncs a throttle.
  rpc SyncThrottles(SyncThrottlesRequest) returns (SyncThrottlesResponse);

  // Pushs a throttle.
  rpc PushThrottle(PushThrottleRequest) returns (PushThrottleResponse);

  // Pulls a throttle.
  rpc PullThrottles(PullThrottlesRequest) returns (PullThrottlesResponse);

  // Reconciles a throttle.
  rpc ReconcileThrottles(ReconcileThrottlesRequest) returns (ReconcileThrottlesResponse);

  // Exchanges changes of throttles with a peer.
  rpc StreamThrottleChanges(stream StreamThrottleChangesRequest) returns (stream StreamThrottleChangesResponse);

  // Resolves a throttle.
  rpc ResolveThrottleConflict(ResolveThrottleConflictRequest) returns (ResolveThrottleConflictResponse);

  // Returns a throttle.
  rpc GetThrottleSyncState(GetThrottleSyncStateRequest) returns (GetThrottleSyncStateResponse);

  // Lists throttles a page at a time.
  rpc ListThrottleConflicts(ListThrottleConflictsRequest) returns (ListThrottleConflictsResponse);
}

// The request of `SyncThrottles`.
message SyncThrottlesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  Throttle throttle = 3;
  SyncThrottlesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncThrottles`.
message SyncThrottlesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Throttle throttle = 1;
  SyncThrottlesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushThrottle`.
message PushThrottleRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
