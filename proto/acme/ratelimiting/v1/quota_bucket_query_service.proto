syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketQueryServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Answers read-only questions about quota buckets, for screens and reports.
service QuotaBucketQueryService {
  // Returns a quota bucket.
  rpc LookupQuotaBucket(LookupQuotaBucketRequest) returns (LookupQuotaBucketResponse);

  // Lists quota buckets a page at a time.
  rpc BrowseQuotaBuckets(BrowseQuotaBucketsRequest) returns (BrowseQuotaBucketsResponse);

  // Lists quota buckets a page at a time.
  rpc FindQuotaBuckets(FindQuotaBucketsRequest) returns (FindQuotaBucketsResponse);

  // Counts quota buckets by status.
  rpc CountQuotaBuckets(CountQuotaBucketsRequest) returns (CountQuotaBucketsResponse);

  // Returns several quota buckets at once.
  rpc ResolveQuotaBuckets(ResolveQuotaBucketsRequest) returns (ResolveQuotaBucketsResponse);

  // Summarizes a quota bucket.
  rpc SummarizeQuotaBuckets(SummarizeQuotaBucketsRequest) returns (SummarizeQuotaBucketsResponse);

  // Returns a quota bucket.
  rpc PeekQuotaBucket(PeekQuotaBucketRequest) returns (PeekQuotaBucketResponse);
}

// The request of `LookupQuotaBucket`.
message LookupQuotaBucketRequest {
  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupQuotaBucket`.
message LookupQuotaBucketResponse {
  QuotaBucket quota_bucket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseQuotaBuckets`.
message BrowseQuotaBucketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseQuotaBucketsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseQuotaBuckets`.
message BrowseQuotaBucketsResponse {
  repeated QuotaBucket quota_buckets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindQuotaBuckets`.
message FindQuotaBucketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindQuotaBucketsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindQuotaBuckets`.
message FindQuotaBucketsResponse {
  repeated QuotaBucket quota_buckets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountQuotaBuckets`.
message CountQuotaBucketsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountQuotaBucketsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountQuotaBuckets`.
message CountQuotaBucketsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveQuotaBuckets`.
message ResolveQuotaBucketsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string quota_bucket_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveQuotaBuckets`.
message ResolveQuotaBucketsResponse {
  repeated QuotaBucket quota_buckets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeQuotaBuckets`.
message SummarizeQuotaBucketsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  SummarizeQuotaBucketsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeQuotaBuckets`.
message SummarizeQuotaBucketsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekQuotaBucket`.
message PeekQuotaBucketRequest {
  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekQuotaBucket`.
message PeekQuotaBucketResponse {
  QuotaBucket quota_bucket = 1;
  acme.common.v1.OperationResult result = 2;
}
