syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketCalculationServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Computes the figures of a quota bucket, such as totals, taxes, and estimates.
service QuotaBucketCalculationService {
  // Calculates a quota bucket.
  rpc CalculateQuotaBucket(CalculateQuotaBucketRequest) returns (CalculateQuotaBucketResponse);

  // Estimates a quota bucket.
  rpc EstimateQuotaBucket(EstimateQuotaBucketRequest) returns (EstimateQuotaBucketResponse);

  // Quotes a quota bucket.
  rpc QuoteQuotaBucket(QuoteQuotaBucketRequest) returns (QuoteQuotaBucketResponse);

  // Compares a quota bucket.
  rpc CompareQuotaBucketOptions(CompareQuotaBucketOptionsRequest) returns (CompareQuotaBucketOptionsResponse);

  // Recalculates a quota bucket.
  rpc RecalculateQuotaBuckets(RecalculateQuotaBucketsRequest) returns (RecalculateQuotaBucketsResponse);

  // Simulates a quota bucket.
  rpc SimulateQuotaBucket(SimulateQuotaBucketRequest) returns (SimulateQuotaBucketResponse);

  // Explains a quota bucket.
  rpc ExplainQuotaBucketCalculation(ExplainQuotaBucketCalculationRequest) returns (ExplainQuotaBucketCalculationResponse);

  // Returns a quota bucket.
  rpc GetQuotaBucketRates(GetQuotaBucketRatesRequest) returns (GetQuotaBucketRatesResponse);
}

// The request of `CalculateQuotaBucket`.
message CalculateQuotaBucketRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  CalculateQuotaBucketRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateQuotaBucket`.
message CalculateQuotaBucketResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateQuotaBucketResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  QuotaBucket quota_bucket = 1;
  CalculateQuotaBucketResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

