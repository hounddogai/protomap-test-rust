// The request of `ScheduleThrottleExpiry`.
message ScheduleThrottleExpiryRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  Throttle throttle = 3;
  ScheduleThrottleExpiryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScheduleThrottleExpiry`.
message ScheduleThrottleExpiryResponse {
