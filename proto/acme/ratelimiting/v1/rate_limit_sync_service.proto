syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitSyncServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Keeps rate limits in step with the systems of record in other regions.
service RateLimitSyncService {
  // Syncs a rate limit.
  rpc SyncRateLimits(SyncRateLimitsRequest) returns (SyncRateLimitsResponse);

  // Pushs a rate limit.
  rpc PushRateLimit(PushRateLimitRequest) returns (PushRateLimitResponse);

  // Pulls a rate limit.
  rpc PullRateLimits(PullRateLimitsRequest) returns (PullRateLimitsResponse);

  // Reconciles a rate limit.
  rpc ReconcileRateLimits(ReconcileRateLimitsRequest) returns (ReconcileRateLimitsResponse);

  // Exchanges changes of rate limits with a peer.
  rpc StreamRateLimitChanges(stream StreamRateLimitChangesRequest) returns (stream StreamRateLimitChangesResponse);

  // Resolves a rate limit.
  rpc ResolveRateLimitConflict(ResolveRateLimitConflictRequest) returns (ResolveRateLimitConflictResponse);

  // Returns a rate limit.
  rpc GetRateLimitSyncState(GetRateLimitSyncStateRequest) returns (GetRateLimitSyncStateResponse);

  // Lists rate limits a page at a time.
  rpc ListRateLimitConflicts(ListRateLimitConflictsRequest) returns (ListRateLimitConflictsResponse);
}

// The request of `SyncRateLimits`.
message SyncRateLimitsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  RateLimit rate_limit = 3;
  SyncRateLimitsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncRateLimits`.
message SyncRateLimitsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RateLimit rate_limit = 1;
  SyncRateLimitsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushRateLimit`.
message PushRateLimitRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
