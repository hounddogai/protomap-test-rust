syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketValidationServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Checks quota buckets against the rules before anything acts on them.
service QuotaBucketValidationService {
  // Validates a quota bucket.
  rpc ValidateQuotaBucket(ValidateQuotaBucketRequest) returns (ValidateQuotaBucketResponse);

  // Previews a quota bucket.
  rpc PreviewQuotaBucket(PreviewQuotaBucketRequest) returns (PreviewQuotaBucketResponse);

  // Checks a quota bucket.
  rpc CheckQuotaBucketEligibility(CheckQuotaBucketEligibilityRequest) returns (CheckQuotaBucketEligibilityResponse);

  // Normalizes a quota bucket.
  rpc NormalizeQuotaBucket(NormalizeQuotaBucketRequest) returns (NormalizeQuotaBucketResponse);

  // Explains a quota bucket.
  rpc ExplainQuotaBucketDecision(ExplainQuotaBucketDecisionRequest) returns (ExplainQuotaBucketDecisionResponse);

  // Scores a quota bucket.
  rpc ScoreQuotaBucket(ScoreQuotaBucketRequest) returns (ScoreQuotaBucketResponse);

  // Lints a quota bucket.
  rpc LintQuotaBuckets(LintQuotaBucketsRequest) returns (LintQuotaBucketsResponse);

  // Returns a quota bucket.
  rpc GetQuotaBucketRules(GetQuotaBucketRulesRequest) returns (GetQuotaBucketRulesResponse);
}

// The request of `ValidateQuotaBucket`.
message ValidateQuotaBucketRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  ValidateQuotaBucketRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateQuotaBucket`.
message ValidateQuotaBucketResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  ValidateQuotaBucketResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

