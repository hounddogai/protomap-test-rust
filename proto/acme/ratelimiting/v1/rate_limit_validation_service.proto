syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitValidationServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Checks rate limits against the rules before anything acts on them.
service RateLimitValidationService {
  // Validates a rate limit.
  rpc ValidateRateLimit(ValidateRateLimitRequest) returns (ValidateRateLimitResponse);

  // Previews a rate limit.
  rpc PreviewRateLimit(PreviewRateLimitRequest) returns (PreviewRateLimitResponse);

  // Checks a rate limit.
  rpc CheckRateLimitEligibility(CheckRateLimitEligibilityRequest) returns (CheckRateLimitEligibilityResponse);

  // Normalizes a rate limit.
  rpc NormalizeRateLimit(NormalizeRateLimitRequest) returns (NormalizeRateLimitResponse);

  // Explains a rate limit.
  rpc ExplainRateLimitDecision(ExplainRateLimitDecisionRequest) returns (ExplainRateLimitDecisionResponse);

  // Lints a rate limit.
  rpc LintRateLimits(LintRateLimitsRequest) returns (LintRateLimitsResponse);

  // Returns a rate limit.
  rpc GetRateLimitRules(GetRateLimitRulesRequest) returns (GetRateLimitRulesResponse);
}

// The request of `ValidateRateLimit`.
message ValidateRateLimitRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  RateLimit rate_limit = 3;
  ValidateRateLimitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRateLimit`.
message ValidateRateLimitResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RateLimit rate_limit = 1;
  ValidateRateLimitResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

