option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketLifecycleServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Moves a quota bucket between the states of its lifecycle.
service QuotaBucketLifecycleService {
  // Activates a quota bucket.
  rpc ActivateQuotaBucket(ActivateQuotaBucketRequest) returns (ActivateQuotaBucketResponse);

  // Suspends a quota bucket.
  rpc SuspendQuotaBucket(SuspendQuotaBucketRequest) returns (SuspendQuotaBucketResponse);

  // Reinstates a quota bucket.
  rpc ReinstateQuotaBucket(ReinstateQuotaBucketRequest) returns (ReinstateQuotaBucketResponse);

  // Terminates a quota bucket.
  rpc TerminateQuotaBucket(TerminateQuotaBucketRequest) returns (TerminateQuotaBucketResponse);

  // Renews a quota bucket.
  rpc RenewQuotaBucket(RenewQuotaBucketRequest) returns (RenewQuotaBucketResponse);

  // Expires a quota bucket.
  rpc ExpireQuotaBucket(ExpireQuotaBucketRequest) returns (ExpireQuotaBucketResponse);

  // Returns a quota bucket.
  rpc GetQuotaBucketLifecycle(GetQuotaBucketLifecycleRequest) returns (GetQuotaBucketLifecycleResponse);

  // Schedules a quota bucket.
  rpc ScheduleQuotaBucketExpiry(ScheduleQuotaBucketExpiryRequest) returns (ScheduleQuotaBucketExpiryResponse);
}

// The request of `ActivateQuotaBucket`.
message ActivateQuotaBucketRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  ActivateQuotaBucketRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateQuotaBucket`.
message ActivateQuotaBucketResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  ActivateQuotaBucketResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

