syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitWorkflowServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Runs the long-lived workflow that takes a rate limit from start to finish.
service RateLimitWorkflowService {
  // Starts a rate limit.
  rpc StartRateLimitWorkflow(StartRateLimitWorkflowRequest) returns (StartRateLimitWorkflowResponse);

  // Advances a rate limit.
  rpc AdvanceRateLimitWorkflow(AdvanceRateLimitWorkflowRequest) returns (AdvanceRateLimitWorkflowResponse);

  // Cancels a rate limit.
  rpc CancelRateLimitWorkflow(CancelRateLimitWorkflowRequest) returns (CancelRateLimitWorkflowResponse);

  // Retrys a rate limit.
  rpc RetryRateLimitWorkflow(RetryRateLimitWorkflowRequest) returns (RetryRateLimitWorkflowResponse);

  // Pauses a rate limit.
  rpc PauseRateLimitWorkflow(PauseRateLimitWorkflowRequest) returns (PauseRateLimitWorkflowResponse);

  // Returns a rate limit.
  rpc InspectRateLimitWorkflow(InspectRateLimitWorkflowRequest) returns (InspectRateLimitWorkflowResponse);

  // Lists rate limits a page at a time.
  rpc ListRateLimitWorkflows(ListRateLimitWorkflowsRequest) returns (ListRateLimitWorkflowsResponse);

  // Signals a rate limit.
  rpc SignalRateLimitWorkflow(SignalRateLimitWorkflowRequest) returns (SignalRateLimitWorkflowResponse);
}

// The request of `StartRateLimitWorkflow`.
message StartRateLimitWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  RateLimit rate_limit = 3;
  StartRateLimitWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRateLimitWorkflow`.
message StartRateLimitWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RateLimit rate_limit = 1;
  StartRateLimitWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

