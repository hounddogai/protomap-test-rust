syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "ThrottleReportingServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Builds and schedules reports about throttles.
service ThrottleReportingService {
  // Generates a throttle.
  rpc GenerateThrottleReport(GenerateThrottleReportRequest) returns (GenerateThrottleReportResponse);

  // Returns a throttle.
  rpc FetchThrottleReport(FetchThrottleReportRequest) returns (FetchThrottleReportResponse);

  // Schedules a throttle.
  rpc ScheduleThrottleReport(ScheduleThrottleReportRequest) returns (ScheduleThrottleReportResponse);

  // Streams the changes of throttles as they happen.
  rpc StreamThrottleMetrics(StreamThrottleMetricsRequest) returns (stream StreamThrottleMetricsResponse);

  // Lists throttles a page at a time.
  rpc ListThrottleReports(ListThrottleReportsRequest) returns (ListThrottleReportsResponse);

  // Shares a throttle.
  rpc ShareThrottleReport(ShareThrottleReportRequest) returns (ShareThrottleReportResponse);

  // Counts throttles by status.
  rpc CountThrottleTotals(CountThrottleTotalsRequest) returns (CountThrottleTotalsResponse);

  // Deletes a throttle.
  rpc DeleteThrottleReport(DeleteThrottleReportRequest) returns (DeleteThrottleReportResponse);
}

// The request of `GenerateThrottleReport`.
message GenerateThrottleReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  GenerateThrottleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateThrottleReport`.
message GenerateThrottleReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchThrottleReport`.
message FetchThrottleReportRequest {
  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchThrottleReport`.
message FetchThrottleReportResponse {
  Throttle throttle = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleThrottleReport`.
message ScheduleThrottleReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  ScheduleThrottleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleThrottleReport`.
message ScheduleThrottleReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamThrottleMetrics`.
message StreamThrottleMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ThrottleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamThrottleMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamThrottleMetrics`.
message StreamThrottleMetricsResponse {
  Throttle throttle = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListThrottleReports`.
message ListThrottleReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ThrottleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListThrottleReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListThrottleReports`.
message ListThrottleReportsResponse {
  repeated Throttle throttles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareThrottleReport`.
message ShareThrottleReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  ShareThrottleReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareThrottleReport`.
message ShareThrottleReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Throttle throttle = 1;
  ShareThrottleReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountThrottleTotals`.
message CountThrottleTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ThrottleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountThrottleTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountThrottleTotals`.
message CountThrottleTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteThrottleReport`.
message DeleteThrottleReportRequest {
  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteThrottleReport`.
message DeleteThrottleReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
