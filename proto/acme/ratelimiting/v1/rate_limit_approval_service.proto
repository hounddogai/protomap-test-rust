syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitApprovalServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Routes rate limits through approval, with escalation and delegation.
service RateLimitApprovalService {
  // Submits a rate limit.
  rpc SubmitRateLimit(SubmitRateLimitRequest) returns (SubmitRateLimitResponse);

  // Approves a rate limit.
  rpc ApproveRateLimit(ApproveRateLimitRequest) returns (ApproveRateLimitResponse);

  // Rejects a rate limit.
  rpc RejectRateLimit(RejectRateLimitRequest) returns (RejectRateLimitResponse);

  // Escalates a rate limit.
  rpc EscalateRateLimit(EscalateRateLimitRequest) returns (EscalateRateLimitResponse);

  // Lists rate limits a page at a time.
  rpc ListPendingRateLimits(ListPendingRateLimitsRequest) returns (ListPendingRateLimitsResponse);

  // Delegates a rate limit.
  rpc DelegateRateLimitApproval(DelegateRateLimitApprovalRequest) returns (DelegateRateLimitApprovalResponse);

  // Recalls a rate limit.
  rpc RecallRateLimit(RecallRateLimitRequest) returns (RecallRateLimitResponse);

  // Returns a rate limit.
  rpc GetRateLimitApprovalStatus(GetRateLimitApprovalStatusRequest) returns (GetRateLimitApprovalStatusResponse);

  // Comments a rate limit.
  rpc CommentRateLimitApproval(CommentRateLimitApprovalRequest) returns (CommentRateLimitApprovalResponse);
}

// The request of `SubmitRateLimit`.
message SubmitRateLimitRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  RateLimit rate_limit = 3;
  SubmitRateLimitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRateLimit`.
message SubmitRateLimitResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RateLimit rate_limit = 1;
  SubmitRateLimitResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

