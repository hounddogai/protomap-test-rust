syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketReportingServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Builds and schedules reports about quota buckets.
service QuotaBucketReportingService {
  // Generates a quota bucket.
  rpc GenerateQuotaBucketReport(GenerateQuotaBucketReportRequest) returns (GenerateQuotaBucketReportResponse);

  // Returns a quota bucket.
  rpc FetchQuotaBucketReport(FetchQuotaBucketReportRequest) returns (FetchQuotaBucketReportResponse);

  // Schedules a quota bucket.
  rpc ScheduleQuotaBucketReport(ScheduleQuotaBucketReportRequest) returns (ScheduleQuotaBucketReportResponse);

  // Streams the changes of quota buckets as they happen.
  rpc StreamQuotaBucketMetrics(StreamQuotaBucketMetricsRequest) returns (stream StreamQuotaBucketMetricsResponse);

  // Lists quota buckets a page at a time.
  rpc ListQuotaBucketReports(ListQuotaBucketReportsRequest) returns (ListQuotaBucketReportsResponse);

  // Shares a quota bucket.
  rpc ShareQuotaBucketReport(ShareQuotaBucketReportRequest) returns (ShareQuotaBucketReportResponse);

  // Counts quota buckets by status.
  rpc CountQuotaBucketTotals(CountQuotaBucketTotalsRequest) returns (CountQuotaBucketTotalsResponse);

  // Deletes a quota bucket.
  rpc DeleteQuotaBucketReport(DeleteQuotaBucketReportRequest) returns (DeleteQuotaBucketReportResponse);
}

// The request of `GenerateQuotaBucketReport`.
message GenerateQuotaBucketReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  GenerateQuotaBucketReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateQuotaBucketReport`.
message GenerateQuotaBucketReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchQuotaBucketReport`.
message FetchQuotaBucketReportRequest {
  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchQuotaBucketReport`.
message FetchQuotaBucketReportResponse {
  QuotaBucket quota_bucket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleQuotaBucketReport`.
message ScheduleQuotaBucketReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  ScheduleQuotaBucketReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleQuotaBucketReport`.
message ScheduleQuotaBucketReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamQuotaBucketMetrics`.
message StreamQuotaBucketMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamQuotaBucketMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamQuotaBucketMetrics`.
message StreamQuotaBucketMetricsResponse {
  QuotaBucket quota_bucket = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListQuotaBucketReports`.
message ListQuotaBucketReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListQuotaBucketReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListQuotaBucketReports`.
message ListQuotaBucketReportsResponse {
  repeated QuotaBucket quota_buckets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareQuotaBucketReport`.
message ShareQuotaBucketReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  ShareQuotaBucketReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareQuotaBucketReport`.
message ShareQuotaBucketReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  ShareQuotaBucketReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountQuotaBucketTotals`.
message CountQuotaBucketTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountQuotaBucketTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountQuotaBucketTotals`.
message CountQuotaBucketTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteQuotaBucketReport`.
message DeleteQuotaBucketReportRequest {
  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteQuotaBucketReport`.
message DeleteQuotaBucketReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
