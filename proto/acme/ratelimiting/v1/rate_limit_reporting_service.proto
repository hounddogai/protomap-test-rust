syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitReportingServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Builds and schedules reports about rate limits.
service RateLimitReportingService {
  // Generates a rate limit.
  rpc GenerateRateLimitReport(GenerateRateLimitReportRequest) returns (GenerateRateLimitReportResponse);

  // Returns a rate limit.
  rpc FetchRateLimitReport(FetchRateLimitReportRequest) returns (FetchRateLimitReportResponse);

  // Streams the changes of rate limits as they happen.
  rpc StreamRateLimitMetrics(StreamRateLimitMetricsRequest) returns (stream StreamRateLimitMetricsResponse);

  // Lists rate limits a page at a time.
  rpc ListRateLimitReports(ListRateLimitReportsRequest) returns (ListRateLimitReportsResponse);

  // Shares a rate limit.
  rpc ShareRateLimitReport(ShareRateLimitReportRequest) returns (ShareRateLimitReportResponse);

  // Counts rate limits by status.
  rpc CountRateLimitTotals(CountRateLimitTotalsRequest) returns (CountRateLimitTotalsResponse);
}

// The request of `GenerateRateLimitReport`.
message GenerateRateLimitReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  GenerateRateLimitReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRateLimitReport`.
message GenerateRateLimitReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRateLimitReport`.
message FetchRateLimitReportRequest {
  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRateLimitReport`.
message FetchRateLimitReportResponse {
  RateLimit rate_limit = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamRateLimitMetrics`.
message StreamRateLimitMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRateLimitMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRateLimitMetrics`.
message StreamRateLimitMetricsResponse {
  RateLimit rate_limit = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRateLimitReports`.
message ListRateLimitReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRateLimitReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRateLimitReports`.
message ListRateLimitReportsResponse {
  repeated RateLimit rate_limits = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRateLimitReport`.
message ShareRateLimitReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  ShareRateLimitReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRateLimitReport`.
message ShareRateLimitReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RateLimit rate_limit = 1;
  ShareRateLimitReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRateLimitTotals`.
message CountRateLimitTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RateLimitStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRateLimitTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRateLimitTotals`.
message CountRateLimitTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
