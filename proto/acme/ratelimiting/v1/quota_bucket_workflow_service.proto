option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketWorkflowServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Runs the long-lived workflow that takes a quota bucket from start to finish.
service QuotaBucketWorkflowService {
  // Starts a quota bucket.
  rpc StartQuotaBucketWorkflow(StartQuotaBucketWorkflowRequest) returns (StartQuotaBucketWorkflowResponse);

  // Advances a quota bucket.
  rpc AdvanceQuotaBucketWorkflow(AdvanceQuotaBucketWorkflowRequest) returns (AdvanceQuotaBucketWorkflowResponse);

  // Cancels a quota bucket.
  rpc CancelQuotaBucketWorkflow(CancelQuotaBucketWorkflowRequest) returns (CancelQuotaBucketWorkflowResponse);

  // Retrys a quota bucket.
  rpc RetryQuotaBucketWorkflow(RetryQuotaBucketWorkflowRequest) returns (RetryQuotaBucketWorkflowResponse);

  // Pauses a quota bucket.
  rpc PauseQuotaBucketWorkflow(PauseQuotaBucketWorkflowRequest) returns (PauseQuotaBucketWorkflowResponse);

  // Resumes a quota bucket.
  rpc ResumeQuotaBucketWorkflow(ResumeQuotaBucketWorkflowRequest) returns (ResumeQuotaBucketWorkflowResponse);

  // Returns a quota bucket.
  rpc InspectQuotaBucketWorkflow(InspectQuotaBucketWorkflowRequest) returns (InspectQuotaBucketWorkflowResponse);

  // Lists quota buckets a page at a time.
  rpc ListQuotaBucketWorkflows(ListQuotaBucketWorkflowsRequest) returns (ListQuotaBucketWorkflowsResponse);

  // Signals a quota bucket.
  rpc SignalQuotaBucketWorkflow(SignalQuotaBucketWorkflowRequest) returns (SignalQuotaBucketWorkflowResponse);
}

// The request of `StartQuotaBucketWorkflow`.
message StartQuotaBucketWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  StartQuotaBucketWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartQuotaBucketWorkflow`.
message StartQuotaBucketWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  StartQuotaBucketWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

