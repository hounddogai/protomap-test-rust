syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "ThrottleWorkflowServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Runs the long-lived workflow that takes a throttle from start to finish.
service ThrottleWorkflowService {
  // Starts a throttle.
  rpc StartThrottleWorkflow(StartThrottleWorkflowRequest) returns (StartThrottleWorkflowResponse);

  // Advances a throttle.
  rpc AdvanceThrottleWorkflow(AdvanceThrottleWorkflowRequest) returns (AdvanceThrottleWorkflowResponse);

  // Cancels a throttle.
  rpc CancelThrottleWorkflow(CancelThrottleWorkflowRequest) returns (CancelThrottleWorkflowResponse);

  // Retrys a throttle.
  rpc RetryThrottleWorkflow(RetryThrottleWorkflowRequest) returns (RetryThrottleWorkflowResponse);

  // Resumes a throttle.
  rpc ResumeThrottleWorkflow(ResumeThrottleWorkflowRequest) returns (ResumeThrottleWorkflowResponse);

  // Returns a throttle.
  rpc InspectThrottleWorkflow(InspectThrottleWorkflowRequest) returns (InspectThrottleWorkflowResponse);

  // Lists throttles a page at a time.
  rpc ListThrottleWorkflows(ListThrottleWorkflowsRequest) returns (ListThrottleWorkflowsResponse);

  // Signals a throttle.
  rpc SignalThrottleWorkflow(SignalThrottleWorkflowRequest) returns (SignalThrottleWorkflowResponse);
}

// The request of `StartThrottleWorkflow`.
message StartThrottleWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  Throttle throttle = 3;
  StartThrottleWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartThrottleWorkflow`.
message StartThrottleWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Throttle throttle = 1;
  StartThrottleWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

