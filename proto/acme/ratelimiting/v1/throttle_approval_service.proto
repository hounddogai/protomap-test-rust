syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "ThrottleApprovalServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Routes throttles through approval, with escalation and delegation.
service ThrottleApprovalService {
  // Submits a throttle.
  rpc SubmitThrottle(SubmitThrottleRequest) returns (SubmitThrottleResponse);

  // Approves a throttle.
  rpc ApproveThrottle(ApproveThrottleRequest) returns (ApproveThrottleResponse);

  // Rejects a throttle.
  rpc RejectThrottle(RejectThrottleRequest) returns (RejectThrottleResponse);

  // Escalates a throttle.
  rpc EscalateThrottle(EscalateThrottleRequest) returns (EscalateThrottleResponse);

  // Lists throttles a page at a time.
  rpc ListPendingThrottles(ListPendingThrottlesRequest) returns (ListPendingThrottlesResponse);

  // Delegates a throttle.
  rpc DelegateThrottleApproval(DelegateThrottleApprovalRequest) returns (DelegateThrottleApprovalResponse);

  // Recalls a throttle.
  rpc RecallThrottle(RecallThrottleRequest) returns (RecallThrottleResponse);

  // Returns a throttle.
  rpc GetThrottleApprovalStatus(GetThrottleApprovalStatusRequest) returns (GetThrottleApprovalStatusResponse);
}

// The request of `SubmitThrottle`.
message SubmitThrottleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string throttle_id = 2;
  Throttle throttle = 3;
  SubmitThrottleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitThrottle`.
message SubmitThrottleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Throttle throttle = 1;
  SubmitThrottleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

