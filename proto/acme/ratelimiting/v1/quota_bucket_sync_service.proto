syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "QuotaBucketSyncServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Keeps quota buckets in step with the systems of record in other regions.
service QuotaBucketSyncService {
  // Syncs a quota bucket.
  rpc SyncQuotaBuckets(SyncQuotaBucketsRequest) returns (SyncQuotaBucketsResponse);

  // Pushs a quota bucket.
  rpc PushQuotaBucket(PushQuotaBucketRequest) returns (PushQuotaBucketResponse);

  // Pulls a quota bucket.
  rpc PullQuotaBuckets(PullQuotaBucketsRequest) returns (PullQuotaBucketsResponse);

  // Exchanges changes of quota buckets with a peer.
  rpc StreamQuotaBucketChanges(stream StreamQuotaBucketChangesRequest) returns (stream StreamQuotaBucketChangesResponse);

  // Resolves a quota bucket.
  rpc ResolveQuotaBucketConflict(ResolveQuotaBucketConflictRequest) returns (ResolveQuotaBucketConflictResponse);

  // Returns a quota bucket.
  rpc GetQuotaBucketSyncState(GetQuotaBucketSyncStateRequest) returns (GetQuotaBucketSyncStateResponse);

  // Lists quota buckets a page at a time.
  rpc ListQuotaBucketConflicts(ListQuotaBucketConflictsRequest) returns (ListQuotaBucketConflictsResponse);
}

// The request of `SyncQuotaBuckets`.
message SyncQuotaBucketsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  SyncQuotaBucketsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncQuotaBuckets`.
message SyncQuotaBucketsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  SyncQuotaBucketsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushQuotaBucket`.
message PushQuotaBucketRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  PushQuotaBucketRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushQuotaBucket`.
message PushQuotaBucketResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  PushQuotaBucketResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullQuotaBuckets`.
message PullQuotaBucketsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  PullQuotaBucketsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullQuotaBuckets`.
message PullQuotaBucketsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  PullQuotaBucketsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamQuotaBucketChanges`.
message StreamQuotaBucketChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    QuotaBucket change = 2;
    StreamQuotaBucketChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamQuotaBucketChanges`.
message StreamQuotaBucketChangesResponse {
  QuotaBucket quota_bucket = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolveQuotaBucketConflict`.
message ResolveQuotaBucketConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  QuotaBucket quota_bucket = 3;
  ResolveQuotaBucketConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveQuotaBucketConflict`.
message ResolveQuotaBucketConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  QuotaBucket quota_bucket = 1;
  ResolveQuotaBucketConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetQuotaBucketSyncState`.
message GetQuotaBucketSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string quota_bucket_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetQuotaBucketSyncState`.
message GetQuotaBucketSyncStateResponse {
  QuotaBucket quota_bucket = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListQuotaBucketConflicts`.
message ListQuotaBucketConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated QuotaBucketStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListQuotaBucketConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListQuotaBucketConflicts`.
message ListQuotaBucketConflictsResponse {
  repeated QuotaBucket quota_buckets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
