option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "GatewayPolicyWorkflowServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Runs the long-lived workflow that takes a gateway policy from start to finish.
service GatewayPolicyWorkflowService {
  // Starts a gateway policy.
  rpc StartGatewayPolicyWorkflow(StartGatewayPolicyWorkflowRequest) returns (StartGatewayPolicyWorkflowResponse);

  // Advances a gateway policy.
  rpc AdvanceGatewayPolicyWorkflow(AdvanceGatewayPolicyWorkflowRequest) returns (AdvanceGatewayPolicyWorkflowResponse);

  // Cancels a gateway policy.
  rpc CancelGatewayPolicyWorkflow(CancelGatewayPolicyWorkflowRequest) returns (CancelGatewayPolicyWorkflowResponse);

  // Retrys a gateway policy.
  rpc RetryGatewayPolicyWorkflow(RetryGatewayPolicyWorkflowRequest) returns (RetryGatewayPolicyWorkflowResponse);

  // Pauses a gateway policy.
  rpc PauseGatewayPolicyWorkflow(PauseGatewayPolicyWorkflowRequest) returns (PauseGatewayPolicyWorkflowResponse);

  // Resumes a gateway policy.
  rpc ResumeGatewayPolicyWorkflow(ResumeGatewayPolicyWorkflowRequest) returns (ResumeGatewayPolicyWorkflowResponse);

  // Returns a gateway policy.
  rpc InspectGatewayPolicyWorkflow(InspectGatewayPolicyWorkflowRequest) returns (InspectGatewayPolicyWorkflowResponse);

  // Lists gateway policies a page at a time.
  rpc ListGatewayPolicyWorkflows(ListGatewayPolicyWorkflowsRequest) returns (ListGatewayPolicyWorkflowsResponse);

  // Signals a gateway policy.
  rpc SignalGatewayPolicyWorkflow(SignalGatewayPolicyWorkflowRequest) returns (SignalGatewayPolicyWorkflowResponse);
}

// The request of `StartGatewayPolicyWorkflow`.
message StartGatewayPolicyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  GatewayPolicy gateway_policy = 3;
  StartGatewayPolicyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGatewayPolicyWorkflow`.
message StartGatewayPolicyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GatewayPolicy gateway_policy = 1;
  StartGatewayPolicyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

