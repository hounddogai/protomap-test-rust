syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "GatewayPolicyQueryServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Answers read-only questions about gateway policies, for screens and reports.
service GatewayPolicyQueryService {
  // Returns a gateway policy.
  rpc LookupGatewayPolicy(LookupGatewayPolicyRequest) returns (LookupGatewayPolicyResponse);

  // Lists gateway policies a page at a time.
  rpc BrowseGatewayPolicies(BrowseGatewayPoliciesRequest) returns (BrowseGatewayPoliciesResponse);

  // Lists gateway policies a page at a time.
  rpc FindGatewayPolicies(FindGatewayPoliciesRequest) returns (FindGatewayPoliciesResponse);

  // Counts gateway policies by status.
  rpc CountGatewayPolicies(CountGatewayPoliciesRequest) returns (CountGatewayPoliciesResponse);

  // Summarizes a gateway policy.
  rpc SummarizeGatewayPolicies(SummarizeGatewayPoliciesRequest) returns (SummarizeGatewayPoliciesResponse);

  // Lists gateway policies a page at a time.
  rpc SuggestGatewayPolicies(SuggestGatewayPoliciesRequest) returns (SuggestGatewayPoliciesResponse);

  // Returns a gateway policy.
  rpc PeekGatewayPolicy(PeekGatewayPolicyRequest) returns (PeekGatewayPolicyResponse);
}

// The request of `LookupGatewayPolicy`.
message LookupGatewayPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupGatewayPolicy`.
message LookupGatewayPolicyResponse {
  GatewayPolicy gateway_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseGatewayPolicies`.
message BrowseGatewayPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GatewayPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseGatewayPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseGatewayPolicies`.
message BrowseGatewayPoliciesResponse {
  repeated GatewayPolicy gateway_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindGatewayPolicies`.
message FindGatewayPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GatewayPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindGatewayPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindGatewayPolicies`.
message FindGatewayPoliciesResponse {
  repeated GatewayPolicy gateway_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountGatewayPolicies`.
message CountGatewayPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GatewayPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountGatewayPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountGatewayPolicies`.
message CountGatewayPoliciesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeGatewayPolicies`.
message SummarizeGatewayPoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  SummarizeGatewayPoliciesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeGatewayPolicies`.
message SummarizeGatewayPoliciesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestGatewayPolicies`.
message SuggestGatewayPoliciesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated GatewayPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestGatewayPoliciesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestGatewayPolicies`.
message SuggestGatewayPoliciesResponse {
  repeated GatewayPolicy gateway_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekGatewayPolicy`.
message PeekGatewayPolicyRequest {
  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekGatewayPolicy`.
message PeekGatewayPolicyResponse {
  GatewayPolicy gateway_policy = 1;
  acme.common.v1.OperationResult result = 2;
}
