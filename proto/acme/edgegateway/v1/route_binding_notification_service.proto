// The request of `GetRouteBindingPreferences`.
message GetRouteBindingPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRouteBindingPreferences`.
message GetRouteBindingPreferencesResponse {
