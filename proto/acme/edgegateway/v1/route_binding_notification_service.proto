syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "RouteBindingNotificationServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Tells the people who follow a route binding what changed.
service RouteBindingNotificationService {
  // Subscribes a route binding.
  rpc SubscribeRouteBindingUpdates(SubscribeRouteBindingUpdatesRequest) returns (SubscribeRouteBindingUpdatesResponse);

  // Unsubscribes a route binding.
  rpc UnsubscribeRouteBindingUpdates(UnsubscribeRouteBindingUpdatesRequest) returns (UnsubscribeRouteBindingUpdatesResponse);

  // Notifys a route binding.
  rpc NotifyRouteBindingWatchers(NotifyRouteBindingWatchersRequest) returns (NotifyRouteBindingWatchersResponse);

  // Lists route bindings a page at a time.
  rpc ListRouteBindingSubscriptions(ListRouteBindingSubscriptionsRequest) returns (ListRouteBindingSubscriptionsResponse);

  // Sends a route binding.
  rpc SendRouteBindingTestNotice(SendRouteBindingTestNoticeRequest) returns (SendRouteBindingTestNoticeResponse);

  // Returns a route binding.
  rpc GetRouteBindingPreferences(GetRouteBindingPreferencesRequest) returns (GetRouteBindingPreferencesResponse);

  // Streams the changes of route bindings as they happen.
  rpc StreamRouteBindingNotices(StreamRouteBindingNoticesRequest) returns (stream StreamRouteBindingNoticesResponse);
}

// The request of `SubscribeRouteBindingUpdates`.
message SubscribeRouteBindingUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  SubscribeRouteBindingUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeRouteBindingUpdates`.
message SubscribeRouteBindingUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  SubscribeRouteBindingUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeRouteBindingUpdates`.
message UnsubscribeRouteBindingUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  UnsubscribeRouteBindingUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeRouteBindingUpdates`.
message UnsubscribeRouteBindingUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  UnsubscribeRouteBindingUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

