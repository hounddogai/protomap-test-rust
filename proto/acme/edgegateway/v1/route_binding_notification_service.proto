    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  NotifyRouteBindingWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRouteBindingSubscriptions`.
message ListRouteBindingSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRouteBindingSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRouteBindingSubscriptions`.
message ListRouteBindingSubscriptionsResponse {
  repeated RouteBinding route_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

