syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "GatewayPolicyNotificationServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Tells the people who follow a gateway policy what changed.
service GatewayPolicyNotificationService {
  // Subscribes a gateway policy.
  rpc SubscribeGatewayPolicyUpdates(SubscribeGatewayPolicyUpdatesRequest) returns (SubscribeGatewayPolicyUpdatesResponse);

  // Unsubscribes a gateway policy.
  rpc UnsubscribeGatewayPolicyUpdates(UnsubscribeGatewayPolicyUpdatesRequest) returns (UnsubscribeGatewayPolicyUpdatesResponse);

  // Notifys a gateway policy.
  rpc NotifyGatewayPolicyWatchers(NotifyGatewayPolicyWatchersRequest) returns (NotifyGatewayPolicyWatchersResponse);

  // Lists gateway policies a page at a time.
  rpc ListGatewayPolicySubscriptions(ListGatewayPolicySubscriptionsRequest) returns (ListGatewayPolicySubscriptionsResponse);

  // Sends a gateway policy.
  rpc SendGatewayPolicyTestNotice(SendGatewayPolicyTestNoticeRequest) returns (SendGatewayPolicyTestNoticeResponse);

  // Returns a gateway policy.
  rpc GetGatewayPolicyPreferences(GetGatewayPolicyPreferencesRequest) returns (GetGatewayPolicyPreferencesResponse);

  // Streams the changes of gateway policies as they happen.
  rpc StreamGatewayPolicyNotices(StreamGatewayPolicyNoticesRequest) returns (stream StreamGatewayPolicyNoticesResponse);
}

// The request of `SubscribeGatewayPolicyUpdates`.
message SubscribeGatewayPolicyUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  SubscribeGatewayPolicyUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeGatewayPolicyUpdates`.
message SubscribeGatewayPolicyUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GatewayPolicy gateway_policy = 1;
  SubscribeGatewayPolicyUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeGatewayPolicyUpdates`.
message UnsubscribeGatewayPolicyUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string gateway_policy_id = 2;
  UnsubscribeGatewayPolicyUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeGatewayPolicyUpdates`.
message UnsubscribeGatewayPolicyUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GatewayPolicy gateway_policy = 1;
  UnsubscribeGatewayPolicyUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyGatewayPolicyWatchers`.
message NotifyGatewayPolicyWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
