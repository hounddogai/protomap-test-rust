message SendGatewayPolicyTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GatewayPolicy gateway_policy = 1;
  SendGatewayPolicyTestNoticeResponse.Outcome outcome = 2;
