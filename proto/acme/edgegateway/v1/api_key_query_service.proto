syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "ApiKeyQueryServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Answers read-only questions about api keys, for screens and reports.
service ApiKeyQueryService {
  // Returns an api key.
  rpc LookupApiKey(LookupApiKeyRequest) returns (LookupApiKeyResponse);

  // Lists api keys a page at a time.
  rpc BrowseApiKeys(BrowseApiKeysRequest) returns (BrowseApiKeysResponse);

  // Counts api keys by status.
  rpc CountApiKeys(CountApiKeysRequest) returns (CountApiKeysResponse);

  // Returns several api keys at once.
  rpc ResolveApiKeys(ResolveApiKeysRequest) returns (ResolveApiKeysResponse);

  // Streams every matching api key.
  rpc ExportApiKeys(ExportApiKeysRequest) returns (stream ExportApiKeysResponse);

  // Summarizes an api key.
  rpc SummarizeApiKeys(SummarizeApiKeysRequest) returns (SummarizeApiKeysResponse);

  // Lists api keys a page at a time.
  rpc SuggestApiKeys(SuggestApiKeysRequest) returns (SuggestApiKeysResponse);

  // Returns an api key.
  rpc PeekApiKey(PeekApiKeyRequest) returns (PeekApiKeyResponse);
}

// The request of `LookupApiKey`.
message LookupApiKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string api_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupApiKey`.
message LookupApiKeyResponse {
  ApiKey api_key = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseApiKeys`.
message BrowseApiKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApiKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseApiKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseApiKeys`.
message BrowseApiKeysResponse {
  repeated ApiKey api_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountApiKeys`.
message CountApiKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApiKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountApiKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountApiKeys`.
message CountApiKeysResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveApiKeys`.
message ResolveApiKeysRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string api_key_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveApiKeys`.
message ResolveApiKeysResponse {
  repeated ApiKey api_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportApiKeys`.
message ExportApiKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApiKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportApiKeysRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportApiKeys`.
message ExportApiKeysResponse {
  ApiKey api_key = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeApiKeys`.
message SummarizeApiKeysRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string api_key_id = 2;
  SummarizeApiKeysRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeApiKeys`.
message SummarizeApiKeysResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestApiKeys`.
message SuggestApiKeysRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApiKeyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestApiKeysRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestApiKeys`.
message SuggestApiKeysResponse {
  repeated ApiKey api_keys = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekApiKey`.
message PeekApiKeyRequest {
  acme.common.v1.RequestContext context = 1;
  string api_key_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekApiKey`.
message PeekApiKeyResponse {
  ApiKey api_key = 1;
  acme.common.v1.OperationResult result = 2;
}
