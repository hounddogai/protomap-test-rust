syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "ApiKeyNotificationServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Tells the people who follow an api key what changed.
service ApiKeyNotificationService {
  // Subscribes an api key.
  rpc SubscribeApiKeyUpdates(SubscribeApiKeyUpdatesRequest) returns (SubscribeApiKeyUpdatesResponse);

  // Unsubscribes an api key.
  rpc UnsubscribeApiKeyUpdates(UnsubscribeApiKeyUpdatesRequest) returns (UnsubscribeApiKeyUpdatesResponse);

  // Notifys an api key.
  rpc NotifyApiKeyWatchers(NotifyApiKeyWatchersRequest) returns (NotifyApiKeyWatchersResponse);

  // Lists api keys a page at a time.
  rpc ListApiKeySubscriptions(ListApiKeySubscriptionsRequest) returns (ListApiKeySubscriptionsResponse);

  // Sends an api key.
  rpc SendApiKeyTestNotice(SendApiKeyTestNoticeRequest) returns (SendApiKeyTestNoticeResponse);

  // Returns an api key.
  rpc GetApiKeyPreferences(GetApiKeyPreferencesRequest) returns (GetApiKeyPreferencesResponse);

  // Streams the changes of api keys as they happen.
  rpc StreamApiKeyNotices(StreamApiKeyNoticesRequest) returns (stream StreamApiKeyNoticesResponse);
}

// The request of `SubscribeApiKeyUpdates`.
message SubscribeApiKeyUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string api_key_id = 2;
  SubscribeApiKeyUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeApiKeyUpdates`.
message SubscribeApiKeyUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiKey api_key = 1;
  SubscribeApiKeyUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeApiKeyUpdates`.
message UnsubscribeApiKeyUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string api_key_id = 2;
  UnsubscribeApiKeyUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeApiKeyUpdates`.
message UnsubscribeApiKeyUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApiKey api_key = 1;
  UnsubscribeApiKeyUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyApiKeyWatchers`.
message NotifyApiKeyWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
