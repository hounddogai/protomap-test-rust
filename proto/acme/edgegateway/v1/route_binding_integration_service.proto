syntax = "proto3";

package acme.edgegateway.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/edgegateway/v1/edgegateway.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Edgegateway.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/edgegateway/v1;edgegatewayv1";
option java_multiple_files = true;
option java_outer_classname = "RouteBindingIntegrationServiceProto";
option java_package = "com.acme.edgegateway.v1";

// Connects external systems that send route binding events.
service RouteBindingIntegrationService {
  // Connects a route binding.
  rpc ConnectRouteBindingSource(ConnectRouteBindingSourceRequest) returns (ConnectRouteBindingSourceResponse);

  // Disconnects a route binding.
  rpc DisconnectRouteBindingSource(DisconnectRouteBindingSourceRequest) returns (DisconnectRouteBindingSourceResponse);

  // Takes a stream of route bindings and answers once at the end.
  rpc IngestRouteBindingEvents(stream IngestRouteBindingEventsRequest) returns (IngestRouteBindingEventsResponse);

  // Replays a route binding.
  rpc ReplayRouteBindingEvents(ReplayRouteBindingEventsRequest) returns (ReplayRouteBindingEventsResponse);

  // Acknowledges a route binding.
  rpc AcknowledgeRouteBindingEvent(AcknowledgeRouteBindingEventRequest) returns (AcknowledgeRouteBindingEventResponse);

  // Exchanges changes of route bindings with a peer.
  rpc RelayRouteBindingMessages(stream RelayRouteBindingMessagesRequest) returns (stream RelayRouteBindingMessagesResponse);

  // Lists route bindings a page at a time.
  rpc ListRouteBindingSources(ListRouteBindingSourcesRequest) returns (ListRouteBindingSourcesResponse);

  // Tests a route binding.
  rpc TestRouteBindingConnection(TestRouteBindingConnectionRequest) returns (TestRouteBindingConnectionResponse);
}

// The request of `ConnectRouteBindingSource`.
message ConnectRouteBindingSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  ConnectRouteBindingSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectRouteBindingSource`.
message ConnectRouteBindingSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  ConnectRouteBindingSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectRouteBindingSource`.
message DisconnectRouteBindingSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  DisconnectRouteBindingSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `DisconnectRouteBindingSource`.
message DisconnectRouteBindingSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  DisconnectRouteBindingSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `IngestRouteBindingEvents`.
message IngestRouteBindingEventsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    IngestRouteBindingEventsRequest.StreamHeader header = 2;
    RouteBinding record = 3;
  }
  int64 sequence = 4;
}

// The response of `IngestRouteBindingEvents`.
message IngestRouteBindingEventsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string route_binding_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated IngestRouteBindingEventsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ReplayRouteBindingEvents`.
message ReplayRouteBindingEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  ReplayRouteBindingEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReplayRouteBindingEvents`.
message ReplayRouteBindingEventsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  ReplayRouteBindingEventsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AcknowledgeRouteBindingEvent`.
message AcknowledgeRouteBindingEventRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  AcknowledgeRouteBindingEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `AcknowledgeRouteBindingEvent`.
message AcknowledgeRouteBindingEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  AcknowledgeRouteBindingEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RelayRouteBindingMessages`.
message RelayRouteBindingMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    RouteBinding change = 2;
    RelayRouteBindingMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayRouteBindingMessages`.
message RelayRouteBindingMessagesResponse {
  RouteBinding route_binding = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRouteBindingSources`.
message ListRouteBindingSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RouteBindingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRouteBindingSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRouteBindingSources`.
message ListRouteBindingSourcesResponse {
  repeated RouteBinding route_bindings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `TestRouteBindingConnection`.
message TestRouteBindingConnectionRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string route_binding_id = 2;
  TestRouteBindingConnectionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `TestRouteBindingConnection`.
message TestRouteBindingConnectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RouteBinding route_binding = 1;
  TestRouteBindingConnectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
