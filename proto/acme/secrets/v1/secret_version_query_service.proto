syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretVersionQueryServiceProto";
option java_package = "com.acme.secrets.v1";

// Answers read-only questions about secret versions, for screens and reports.
service SecretVersionQueryService {
  // Returns a secret version.
  rpc LookupSecretVersion(LookupSecretVersionRequest) returns (LookupSecretVersionResponse);

  // Lists secret versions a page at a time.
  rpc BrowseSecretVersions(BrowseSecretVersionsRequest) returns (BrowseSecretVersionsResponse);

  // Lists secret versions a page at a time.
  rpc FindSecretVersions(FindSecretVersionsRequest) returns (FindSecretVersionsResponse);

  // Counts secret versions by status.
  rpc CountSecretVersions(CountSecretVersionsRequest) returns (CountSecretVersionsResponse);

  // Returns several secret versions at once.
  rpc ResolveSecretVersions(ResolveSecretVersionsRequest) returns (ResolveSecretVersionsResponse);

  // Streams every matching secret version.
  rpc ExportSecretVersions(ExportSecretVersionsRequest) returns (stream ExportSecretVersionsResponse);

  // Summarizes a secret version.
  rpc SummarizeSecretVersions(SummarizeSecretVersionsRequest) returns (SummarizeSecretVersionsResponse);

  // Lists secret versions a page at a time.
  rpc SuggestSecretVersions(SuggestSecretVersionsRequest) returns (SuggestSecretVersionsResponse);

  // Returns a secret version.
  rpc PeekSecretVersion(PeekSecretVersionRequest) returns (PeekSecretVersionResponse);
}

// The request of `LookupSecretVersion`.
message LookupSecretVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSecretVersion`.
message LookupSecretVersionResponse {
  SecretVersion secret_version = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSecretVersions`.
message BrowseSecretVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSecretVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSecretVersions`.
message BrowseSecretVersionsResponse {
  repeated SecretVersion secret_versions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSecretVersions`.
message FindSecretVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSecretVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSecretVersions`.
message FindSecretVersionsResponse {
  repeated SecretVersion secret_versions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSecretVersions`.
message CountSecretVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSecretVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSecretVersions`.
message CountSecretVersionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSecretVersions`.
message ResolveSecretVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string secret_version_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSecretVersions`.
message ResolveSecretVersionsResponse {
  repeated SecretVersion secret_versions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSecretVersions`.
message ExportSecretVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSecretVersionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSecretVersions`.
message ExportSecretVersionsResponse {
  SecretVersion secret_version = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSecretVersions`.
message SummarizeSecretVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  SummarizeSecretVersionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSecretVersions`.
message SummarizeSecretVersionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSecretVersions`.
message SuggestSecretVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SecretVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSecretVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSecretVersions`.
message SuggestSecretVersionsResponse {
  repeated SecretVersion secret_versions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSecretVersion`.
message PeekSecretVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSecretVersion`.
message PeekSecretVersionResponse {
  SecretVersion secret_version = 1;
  acme.common.v1.OperationResult result = 2;
}
