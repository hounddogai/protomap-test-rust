syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretApprovalServiceProto";
option java_package = "com.acme.secrets.v1";

// Routes secrets through approval, with escalation and delegation.
service SecretApprovalService {
  // Submits a secret.
  rpc SubmitSecret(SubmitSecretRequest) returns (SubmitSecretResponse);

  // Approves a secret.
  rpc ApproveSecret(ApproveSecretRequest) returns (ApproveSecretResponse);

  // Rejects a secret.
  rpc RejectSecret(RejectSecretRequest) returns (RejectSecretResponse);

  // Escalates a secret.
  rpc EscalateSecret(EscalateSecretRequest) returns (EscalateSecretResponse);

  // Lists secrets a page at a time.
  rpc ListPendingSecrets(ListPendingSecretsRequest) returns (ListPendingSecretsResponse);

  // Delegates a secret.
  rpc DelegateSecretApproval(DelegateSecretApprovalRequest) returns (DelegateSecretApprovalResponse);

  // Recalls a secret.
  rpc RecallSecret(RecallSecretRequest) returns (RecallSecretResponse);

  // Returns a secret.
  rpc GetSecretApprovalStatus(GetSecretApprovalStatusRequest) returns (GetSecretApprovalStatusResponse);
}

// The request of `SubmitSecret`.
message SubmitSecretRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  Secret secret = 3;
  SubmitSecretRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSecret`.
message SubmitSecretResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Secret secret = 1;
  SubmitSecretResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

