syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "AccessGrantValidationServiceProto";
option java_package = "com.acme.secrets.v1";

// Checks access grants against the rules before anything acts on them.
service AccessGrantValidationService {
  // Validates an access grant.
  rpc ValidateAccessGrant(ValidateAccessGrantRequest) returns (ValidateAccessGrantResponse);

  // Previews an access grant.
  rpc PreviewAccessGrant(PreviewAccessGrantRequest) returns (PreviewAccessGrantResponse);

  // Checks an access grant.
  rpc CheckAccessGrantEligibility(CheckAccessGrantEligibilityRequest) returns (CheckAccessGrantEligibilityResponse);

  // Normalizes an access grant.
  rpc NormalizeAccessGrant(NormalizeAccessGrantRequest) returns (NormalizeAccessGrantResponse);

  // Explains an access grant.
  rpc ExplainAccessGrantDecision(ExplainAccessGrantDecisionRequest) returns (ExplainAccessGrantDecisionResponse);

  // Scores an access grant.
  rpc ScoreAccessGrant(ScoreAccessGrantRequest) returns (ScoreAccessGrantResponse);

  // Lints an access grant.
  rpc LintAccessGrants(LintAccessGrantsRequest) returns (LintAccessGrantsResponse);
}

// The request of `ValidateAccessGrant`.
message ValidateAccessGrantRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string access_grant_id = 2;
  AccessGrant access_grant = 3;
  ValidateAccessGrantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAccessGrant`.
message ValidateAccessGrantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessGrant access_grant = 1;
  ValidateAccessGrantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

