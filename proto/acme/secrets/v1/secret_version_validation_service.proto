syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretVersionValidationServiceProto";
option java_package = "com.acme.secrets.v1";

// Checks secret versions against the rules before anything acts on them.
service SecretVersionValidationService {
  // Validates a secret version.
  rpc ValidateSecretVersion(ValidateSecretVersionRequest) returns (ValidateSecretVersionResponse);

  // Previews a secret version.
  rpc PreviewSecretVersion(PreviewSecretVersionRequest) returns (PreviewSecretVersionResponse);

  // Checks a secret version.
  rpc CheckSecretVersionEligibility(CheckSecretVersionEligibilityRequest) returns (CheckSecretVersionEligibilityResponse);

  // Normalizes a secret version.
  rpc NormalizeSecretVersion(NormalizeSecretVersionRequest) returns (NormalizeSecretVersionResponse);

  // Explains a secret version.
  rpc ExplainSecretVersionDecision(ExplainSecretVersionDecisionRequest) returns (ExplainSecretVersionDecisionResponse);

  // Scores a secret version.
  rpc ScoreSecretVersion(ScoreSecretVersionRequest) returns (ScoreSecretVersionResponse);

  // Lints a secret version.
  rpc LintSecretVersions(LintSecretVersionsRequest) returns (LintSecretVersionsResponse);

  // Returns a secret version.
  rpc GetSecretVersionRules(GetSecretVersionRulesRequest) returns (GetSecretVersionRulesResponse);
}

// The request of `ValidateSecretVersion`.
message ValidateSecretVersionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  SecretVersion secret_version = 3;
  ValidateSecretVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSecretVersion`.
message ValidateSecretVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SecretVersion secret_version = 1;
  ValidateSecretVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

