// The request of `ScoreSecretVersion`.
message ScoreSecretVersionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  SecretVersion secret_version = 3;
  ScoreSecretVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreSecretVersion`.
message ScoreSecretVersionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreSecretVersionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SecretVersion secret_version = 1;
  ScoreSecretVersionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

