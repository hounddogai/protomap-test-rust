syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "AccessGrantApprovalServiceProto";
option java_package = "com.acme.secrets.v1";

// Routes access grants through approval, with escalation and delegation.
service AccessGrantApprovalService {
  // Submits an access grant.
  rpc SubmitAccessGrant(SubmitAccessGrantRequest) returns (SubmitAccessGrantResponse);

  // Approves an access grant.
  rpc ApproveAccessGrant(ApproveAccessGrantRequest) returns (ApproveAccessGrantResponse);

  // Rejects an access grant.
  rpc RejectAccessGrant(RejectAccessGrantRequest) returns (RejectAccessGrantResponse);

  // Lists access grants a page at a time.
  rpc ListPendingAccessGrants(ListPendingAccessGrantsRequest) returns (ListPendingAccessGrantsResponse);

  // Delegates an access grant.
  rpc DelegateAccessGrantApproval(DelegateAccessGrantApprovalRequest) returns (DelegateAccessGrantApprovalResponse);

  // Recalls an access grant.
  rpc RecallAccessGrant(RecallAccessGrantRequest) returns (RecallAccessGrantResponse);

  // Returns an access grant.
  rpc GetAccessGrantApprovalStatus(GetAccessGrantApprovalStatusRequest) returns (GetAccessGrantApprovalStatusResponse);

  // Comments an access grant.
  rpc CommentAccessGrantApproval(CommentAccessGrantApprovalRequest) returns (CommentAccessGrantApprovalResponse);
}

// The request of `SubmitAccessGrant`.
message SubmitAccessGrantRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string access_grant_id = 2;
  AccessGrant access_grant = 3;
  SubmitAccessGrantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAccessGrant`.
message SubmitAccessGrantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessGrant access_grant = 1;
  SubmitAccessGrantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

