syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretVersionApprovalServiceProto";
option java_package = "com.acme.secrets.v1";

// Routes secret versions through approval, with escalation and delegation.
service SecretVersionApprovalService {
  // Submits a secret version.
  rpc SubmitSecretVersion(SubmitSecretVersionRequest) returns (SubmitSecretVersionResponse);

  // Approves a secret version.
  rpc ApproveSecretVersion(ApproveSecretVersionRequest) returns (ApproveSecretVersionResponse);

  // Rejects a secret version.
  rpc RejectSecretVersion(RejectSecretVersionRequest) returns (RejectSecretVersionResponse);

  // Escalates a secret version.
  rpc EscalateSecretVersion(EscalateSecretVersionRequest) returns (EscalateSecretVersionResponse);

  // Lists secret versions a page at a time.
  rpc ListPendingSecretVersions(ListPendingSecretVersionsRequest) returns (ListPendingSecretVersionsResponse);

  // Recalls a secret version.
  rpc RecallSecretVersion(RecallSecretVersionRequest) returns (RecallSecretVersionResponse);

  // Comments a secret version.
  rpc CommentSecretVersionApproval(CommentSecretVersionApprovalRequest) returns (CommentSecretVersionApprovalResponse);
}

// The request of `SubmitSecretVersion`.
message SubmitSecretVersionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  SecretVersion secret_version = 3;
  SubmitSecretVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSecretVersion`.
message SubmitSecretVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SecretVersion secret_version = 1;
  SubmitSecretVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

