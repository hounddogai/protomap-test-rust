option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretVersionWorkflowServiceProto";
option java_package = "com.acme.secrets.v1";

// Runs the long-lived workflow that takes a secret version from start to finish.
service SecretVersionWorkflowService {
  // Starts a secret version.
  rpc StartSecretVersionWorkflow(StartSecretVersionWorkflowRequest) returns (StartSecretVersionWorkflowResponse);

  // Advances a secret version.
  rpc AdvanceSecretVersionWorkflow(AdvanceSecretVersionWorkflowRequest) returns (AdvanceSecretVersionWorkflowResponse);

  // Cancels a secret version.
  rpc CancelSecretVersionWorkflow(CancelSecretVersionWorkflowRequest) returns (CancelSecretVersionWorkflowResponse);

  // Retrys a secret version.
  rpc RetrySecretVersionWorkflow(RetrySecretVersionWorkflowRequest) returns (RetrySecretVersionWorkflowResponse);

  // Pauses a secret version.
  rpc PauseSecretVersionWorkflow(PauseSecretVersionWorkflowRequest) returns (PauseSecretVersionWorkflowResponse);

  // Resumes a secret version.
  rpc ResumeSecretVersionWorkflow(ResumeSecretVersionWorkflowRequest) returns (ResumeSecretVersionWorkflowResponse);

  // Returns a secret version.
  rpc InspectSecretVersionWorkflow(InspectSecretVersionWorkflowRequest) returns (InspectSecretVersionWorkflowResponse);

  // Lists secret versions a page at a time.
  rpc ListSecretVersionWorkflows(ListSecretVersionWorkflowsRequest) returns (ListSecretVersionWorkflowsResponse);

  // Signals a secret version.
  rpc SignalSecretVersionWorkflow(SignalSecretVersionWorkflowRequest) returns (SignalSecretVersionWorkflowResponse);
}

// The request of `StartSecretVersionWorkflow`.
message StartSecretVersionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_version_id = 2;
  SecretVersion secret_version = 3;
  StartSecretVersionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSecretVersionWorkflow`.
message StartSecretVersionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SecretVersion secret_version = 1;
  StartSecretVersionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

