syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "SecretWorkflowServiceProto";
option java_package = "com.acme.secrets.v1";

// Runs the long-lived workflow that takes a secret from start to finish.
service SecretWorkflowService {
  // Starts a secret.
  rpc StartSecretWorkflow(StartSecretWorkflowRequest) returns (StartSecretWorkflowResponse);

  // Advances a secret.
  rpc AdvanceSecretWorkflow(AdvanceSecretWorkflowRequest) returns (AdvanceSecretWorkflowResponse);

  // Retrys a secret.
  rpc RetrySecretWorkflow(RetrySecretWorkflowRequest) returns (RetrySecretWorkflowResponse);

  // Resumes a secret.
  rpc ResumeSecretWorkflow(ResumeSecretWorkflowRequest) returns (ResumeSecretWorkflowResponse);

  // Returns a secret.
  rpc InspectSecretWorkflow(InspectSecretWorkflowRequest) returns (InspectSecretWorkflowResponse);

  // Lists secrets a page at a time.
  rpc ListSecretWorkflows(ListSecretWorkflowsRequest) returns (ListSecretWorkflowsResponse);

  // Signals a secret.
  rpc SignalSecretWorkflow(SignalSecretWorkflowRequest) returns (SignalSecretWorkflowResponse);
}

// The request of `StartSecretWorkflow`.
message StartSecretWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string secret_id = 2;
  Secret secret = 3;
  StartSecretWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSecretWorkflow`.
message StartSecretWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Secret secret = 1;
  StartSecretWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AdvanceSecretWorkflow`.
message AdvanceSecretWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
