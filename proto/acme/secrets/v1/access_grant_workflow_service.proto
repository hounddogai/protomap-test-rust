syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "AccessGrantWorkflowServiceProto";
option java_package = "com.acme.secrets.v1";

// Runs the long-lived workflow that takes an access grant from start to finish.
service AccessGrantWorkflowService {
  // Starts an access grant.
  rpc StartAccessGrantWorkflow(StartAccessGrantWorkflowRequest) returns (StartAccessGrantWorkflowResponse);

  // Advances an access grant.
  rpc AdvanceAccessGrantWorkflow(AdvanceAccessGrantWorkflowRequest) returns (AdvanceAccessGrantWorkflowResponse);

  // Cancels an access grant.
  rpc CancelAccessGrantWorkflow(CancelAccessGrantWorkflowRequest) returns (CancelAccessGrantWorkflowResponse);

  // Retrys an access grant.
  rpc RetryAccessGrantWorkflow(RetryAccessGrantWorkflowRequest) returns (RetryAccessGrantWorkflowResponse);

  // Pauses an access grant.
  rpc PauseAccessGrantWorkflow(PauseAccessGrantWorkflowRequest) returns (PauseAccessGrantWorkflowResponse);

  // Resumes an access grant.
  rpc ResumeAccessGrantWorkflow(ResumeAccessGrantWorkflowRequest) returns (ResumeAccessGrantWorkflowResponse);

  // Returns an access grant.
  rpc InspectAccessGrantWorkflow(InspectAccessGrantWorkflowRequest) returns (InspectAccessGrantWorkflowResponse);

  // Lists access grants a page at a time.
  rpc ListAccessGrantWorkflows(ListAccessGrantWorkflowsRequest) returns (ListAccessGrantWorkflowsResponse);
}

// The request of `StartAccessGrantWorkflow`.
message StartAccessGrantWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string access_grant_id = 2;
  AccessGrant access_grant = 3;
  StartAccessGrantWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAccessGrantWorkflow`.
message StartAccessGrantWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AccessGrant access_grant = 1;
  StartAccessGrantWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

