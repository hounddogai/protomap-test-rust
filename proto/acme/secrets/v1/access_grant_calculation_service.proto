syntax = "proto3";

package acme.secrets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/secrets/v1/secrets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Secrets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/secrets/v1;secretsv1";
option java_multiple_files = true;
option java_outer_classname = "AccessGrantCalculationServiceProto";
option java_package = "com.acme.secrets.v1";

// Computes the figures of an access grant, such as totals, taxes, and estimates.
service AccessGrantCalculationService {
  // Calculates an access grant.
  rpc CalculateAccessGrant(CalculateAccessGrantRequest) returns (CalculateAccessGrantResponse);

  // Estimates an access grant.
  rpc EstimateAccessGrant(EstimateAccessGrantRequest) returns (EstimateAccessGrantResponse);

  // Quotes an access grant.
  rpc QuoteAccessGrant(QuoteAccessGrantRequest) returns (QuoteAccessGrantResponse);

  // Compares an access grant.
  rpc CompareAccessGrantOptions(CompareAccessGrantOptionsRequest) returns (CompareAccessGrantOptionsResponse);

  // Simulates an access grant.
  rpc SimulateAccessGrant(SimulateAccessGrantRequest) returns (SimulateAccessGrantResponse);

  // Explains an access grant.
  rpc ExplainAccessGrantCalculation(ExplainAccessGrantCalculationRequest) returns (ExplainAccessGrantCalculationResponse);

  // Returns an access grant.
  rpc GetAccessGrantRates(GetAccessGrantRatesRequest) returns (GetAccessGrantRatesResponse);
}

// The request of `CalculateAccessGrant`.
message CalculateAccessGrantRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string access_grant_id = 2;
  AccessGrant access_grant = 3;
  CalculateAccessGrantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAccessGrant`.
message CalculateAccessGrantResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAccessGrantResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  AccessGrant access_grant = 1;
  CalculateAccessGrantResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

